name: Android preview APK
on:
  push:
    branches: [feat/reel-native-android]
    paths: [mobile/**, assets/**, .github/workflows/android-preview.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: '1'
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.workers.max=2
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build signed preview APK
        run: ./android/gradlew -p android assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a
      - name: Upload installable preview
        uses: actions/upload-artifact@v7.0.2
        with:
          name: reel-android-preview
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
