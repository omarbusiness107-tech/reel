<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Track movies, series, anime, manga, manhwa and books in one personal media library.">
<meta name="theme-color" content="#101116">
<link rel="icon" href="assets/reel-mark.svg" type="image/svg+xml">
<title>reel | watchlist and reading tracker</title>
<style>
@font-face{
  font-family:"Reel Sans";
  src:url("assets/fonts/Manrope-Variable.ttf") format("truetype");
  font-weight:200 800;
  font-display:swap;
}
@font-face{
  font-family:"Reel Display";
  src:url("assets/fonts/BarlowCondensed-SemiBold.ttf") format("truetype");
  font-weight:600;
  font-display:swap;
}
/* ============================================================
   reel | a single-file media tracker
   ============================================================ */
:root{
  --bg:#101116; --bg2:#15171d; --panel:#1b1d24; --panel2:#242733;
  --line:#30333f; --line2:#454957;
  --fg:#f4f5f2; --fg2:#b8bbc6; --fg3:#858a99;
  --accent:#6276ff; --accent2:#4f66ff; --accent-ink:#ffffff;
  --want:#6d8cf7; --suggested:#dc72a8; --going:#e6a11c; --done:#38bd83; --paused:#aa8be0; --dropped:#7d8190; --waiting:#ef7658;
  --suggested-ink:#260817; --done-ink:#071c13; --waiting-ink:#260c07;
  --shadow:0 18px 44px -24px rgba(2,5,20,.82);
  --ease-out:cubic-bezier(.23,1,.32,1);
  --ease-move:cubic-bezier(.77,0,.175,1);
  --ease-drawer:cubic-bezier(.32,.72,0,1);
  --r:14px;
}
html[data-theme="light"]{
  --bg:#f4f5f8; --bg2:#e9ebf1; --panel:#ffffff; --panel2:#e8eaf2;
  --line:#d8dbe4; --line2:#b9becc;
  --fg:#17191f; --fg2:#505563; --fg3:#6f7585;
  --accent:#425af0; --accent2:#334de3; --accent-ink:#ffffff;
  --want:#4965bd; --suggested:#963368; --going:#966300; --done:#14784f; --paused:#7054a3; --dropped:#626674; --waiting:#b84932;
  --suggested-ink:#ffffff; --done-ink:#ffffff; --waiting-ink:#ffffff;
  --shadow:0 18px 44px -25px rgba(27,36,80,.30);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:15px/1.5 "Reel Sans","Segoe UI","Noto Sans Arabic",sans-serif;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.55;
  background:linear-gradient(115deg,color-mix(in srgb,var(--accent) 7%,transparent),transparent 24%);
}
html[data-theme="light"] body::before{opacity:.7}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--accent)}
::selection{background:var(--accent);color:var(--accent-ink)}

.wrap{position:relative;z-index:1;max-width:1360px;margin:0 auto;padding:0 22px 90px}

/* ---------- top bar ---------- */
header.top{
  position:sticky; top:0; z-index:40; backdrop-filter:blur(14px);
  background:color-mix(in srgb, var(--bg) 84%, transparent);
  border-bottom:1px solid var(--line);
}
.top .row{max-width:1360px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em;font-size:19px}
.brand .mark{
  width:26px;height:26px;border-radius:8px;flex:0 0 auto;
  background:linear-gradient(140deg,var(--accent),var(--accent2));
  box-shadow:0 0 0 1px rgba(255,255,255,.12) inset;
  position:relative;
}
.brand .mark::after{content:'';position:absolute;inset:7px 5px;border-radius:2px;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.55) 0 2px,transparent 2px 5px)}
.brand small{color:var(--fg3);font-weight:500;font-size:12px;letter-spacing:.06em;text-transform:uppercase}

.search{flex:1 1 260px;min-width:200px;position:relative}
.search input{
  width:100%;padding:9px 12px 9px 34px;border-radius:10px;background:var(--panel);
  border:1px solid var(--line);outline:none;
}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,176,46,.14)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.45}
.search kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--fg3);
  border:1px solid var(--line2);border-radius:5px;padding:1px 5px;background:var(--bg2)}
.search input:focus + kbd{display:none}

.btn{
  padding:8px 13px;border-radius:10px;border:1px solid var(--line);background:var(--panel);
  color:var(--fg);font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:7px;
  transition:.15s border-color,.15s background,.15s transform;white-space:nowrap;
}
.btn:hover{border-color:var(--line2);background:var(--panel2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(140deg,var(--accent),var(--accent2));border-color:transparent;color:#180f00;font-weight:650}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.danger{color:#ff6b6b;border-color:color-mix(in srgb,#ff6b6b 30%,var(--line))}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:8px}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);
  display:grid;place-items:center}
.icon-btn:hover{background:var(--panel2)}

/* ---------- fetch progress ---------- */
#fetchbar{height:2px;background:transparent;position:relative;overflow:hidden}
#fetchbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transform:scaleX(0);transform-origin:left;transition:transform 300ms var(--ease-out)}

/* ---------- shelf ---------- */
section.shelf{margin:26px 0 8px}
.shelf-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.shelf-head h2{margin:0;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg2);font-weight:600}
.shelf-head .count{font-size:12px;color:var(--fg3)}
.rail{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 14px;scroll-snap-type:x proximity}
.rail::-webkit-scrollbar{height:8px}
.rail::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px}
.rail::-webkit-scrollbar-track{background:transparent}

.resume{
  flex:0 0 300px;scroll-snap-align:start;display:flex;gap:12px;padding:12px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  transition:.15s border-color,.15s transform;
}
.resume:hover{border-color:var(--line2);transform:translateY(-2px)}
.resume .thumb{width:62px;height:92px;border-radius:9px;flex:0 0 auto;overflow:hidden;position:relative}
.resume .body{min-width:0;display:flex;flex-direction:column;gap:5px;flex:1}
.resume h4{margin:0;font-size:14.5px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.resume .at{font-size:19px;font-weight:700;letter-spacing:-.02em;color:var(--accent);font-variant-numeric:tabular-nums}
.resume .at small{font-size:11.5px;color:var(--fg3);font-weight:500;letter-spacing:.04em;margin-left:5px}
.resume .acts{margin-top:auto;display:flex;gap:6px}

.empty-shelf{
  border:1px dashed var(--line2);border-radius:var(--r);padding:22px;color:var(--fg3);font-size:14px;
  display:flex;align-items:center;gap:10px;
}

/* ---------- filters ---------- */
.filters{
  display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"tabs tabs" "chips actions";
  column-gap:12px;row-gap:10px;align-items:center;margin:22px 0 18px;
  padding-top:20px;border-top:1px solid var(--line);
}
.filters>.tabs{grid-area:tabs;min-width:0;width:100%;justify-self:stretch}
.filters>.chips{grid-area:chips;min-width:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;padding:4px;scroll-padding-inline:4px}
.filters>.chips::-webkit-scrollbar{display:none}
.filters>.chips .chip{flex:0 0 auto;white-space:nowrap}
.filter-actions{grid-area:actions;display:flex;gap:8px;align-items:center;justify-self:end;min-width:0}
.tabs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) minmax(max-content,1.24fr);gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:3px}
.tabs button{min-width:0;padding:6px 8px;border-radius:8px;font-size:15px;color:var(--fg2);font-weight:500;display:flex;gap:6px;align-items:center;justify-content:center}
.tabs button .tab-label{min-width:0;white-space:normal;overflow-wrap:anywhere}
.tabs button .n{flex:0 0 auto;font-size:10px;color:var(--fg3);font-variant-numeric:tabular-nums}
.tabs button[aria-selected="true"]{background:var(--panel2);color:var(--fg);box-shadow:0 1px 0 rgba(255,255,255,.05) inset}
.tabs button[data-type="catalog"]{border-left:0;margin-left:0;padding-left:8px}
.tabs button[data-type="catalog"] .n{color:var(--accent);letter-spacing:.04em}
html[data-theme="light"] .tabs button[aria-selected="true"]{background:var(--bg2)}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  padding:5px 11px;border-radius:99px;border:1px solid var(--line);font-size:12.5px;color:var(--fg2);
  display:inline-flex;align-items:center;gap:6px;background:var(--panel);
}
.chip .swatch{width:7px;height:7px;border-radius:99px;background:var(--c,var(--fg3))}
.chip[aria-pressed="true"]{color:var(--fg);border-color:var(--c,var(--line2));background:color-mix(in srgb,var(--c,var(--panel)) 14%,var(--panel))}
.spacer{flex:1}
select.mini{
  padding:7px 10px;border-radius:9px;background:var(--panel);border:1px solid var(--line);font-size:13px;
}

/* ---------- grid ---------- */
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(158px,1fr))}
.grid.list{grid-template-columns:1fr;gap:8px}

.card{cursor:pointer;position:relative;border-radius:var(--r);transition:.16s transform}
.card:hover{transform:translateY(-3px)}
.poster{
  position:relative;aspect-ratio:2/3;border-radius:var(--r);overflow:hidden;
  background:linear-gradient(150deg,hsl(var(--h1) 42% 26%),hsl(var(--h2) 44% 14%));
  border:1px solid var(--line);box-shadow:var(--shadow);
}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.poster .initials{
  position:absolute;inset:0;display:grid;place-items:center;font-size:34px;font-weight:800;
  letter-spacing:-.03em;color:rgba(255,255,255,.82);text-shadow:0 2px 14px rgba(0,0,0,.5);
}
.poster .initials::after{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 9px);
}
.poster .veil{position:absolute;inset:auto 0 0;height:58%;
  background:linear-gradient(to top,rgba(0,0,0,.82),transparent)}
.tag{
  position:absolute;top:8px;left:8px;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  font-weight:700;padding:3px 7px;border-radius:6px;background:rgba(0,0,0,.6);color:#fff;
  backdrop-filter:blur(4px);
}
.pin{position:absolute;top:8px;right:8px;display:flex;gap:5px;align-items:center}
.state{width:9px;height:9px;border-radius:99px;box-shadow:0 0 0 2px rgba(0,0,0,.45)}
.star{font-size:13px;color:var(--accent);filter:drop-shadow(0 1px 3px rgba(0,0,0,.7))}
.rate.pub{color:var(--accent);font-weight:700}
.field .chip{pointer-events:none}
.rate{font-size:11px;font-weight:700;color:#fff;
  background:rgba(0,0,0,.6);border-radius:5px;padding:2px 5px;backdrop-filter:blur(4px)}
.quick{
  position:absolute;inset:auto 8px 8px auto;display:flex;gap:6px;opacity:0;transform:translateY(4px);
  transition:.16s opacity,.16s transform;
}
.card:hover .quick{opacity:1;transform:none}
.quick button{
  background:rgba(0,0,0,.66);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:8px;
  padding:4px 8px;font-size:12px;font-weight:600;backdrop-filter:blur(6px);
}
.quick button:hover{background:var(--accent);color:#180f00;border-color:transparent}
.pbar{position:absolute;inset:auto 0 0;height:3px;background:rgba(0,0,0,.5)}
.pbar i{display:block;height:100%;background:var(--accent)}
.cmeta{padding:9px 2px 0}
.cmeta h3{margin:0;font-size:13.5px;font-weight:600;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cmeta p{margin:3px 0 0;font-size:11.5px;color:var(--fg3);font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.genre{position:absolute;left:8px;bottom:8px;right:8px;display:flex;gap:4px;flex-wrap:wrap;pointer-events:none}
.genre span{font-size:10px;font-weight:600;letter-spacing:.03em;padding:2px 6px;border-radius:5px;
  background:rgba(0,0,0,.55);color:rgba(255,255,255,.92);backdrop-filter:blur(4px)}
.card:hover .genre{opacity:0}

/* list mode */
.grid.list .card{display:flex;gap:14px;align-items:center;background:var(--panel);
  border:1px solid var(--line);border-radius:11px;padding:8px 12px 8px 8px}
.grid.list .card:hover{transform:none;border-color:var(--line2)}
.grid.list .poster{width:44px;aspect-ratio:2/3;flex:0 0 auto;border-radius:7px;box-shadow:none}
.grid.list .poster .initials{font-size:15px}
.grid.list .poster .tag,.grid.list .poster .veil,.grid.list .poster .rate,
.grid.list .quick,.grid.list .genre{display:none}
.grid.list .cmeta{padding:0;flex:1;min-width:0}
.grid.list .cmeta h3{-webkit-line-clamp:1;font-size:14.5px}
.list-summary,.list-facts,.list-action{display:none}

.empty{padding:70px 20px;text-align:center;color:var(--fg3)}
.empty b{display:block;color:var(--fg2);font-size:16px;margin-bottom:6px}
.catalog-empty{grid-column:1/-1;border:1px dashed var(--line2);border-radius:18px;margin-top:4px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 5%,var(--panel)),var(--panel));}
.catalog-empty .catalog-kicker{display:inline-block;margin-bottom:10px;color:var(--accent);font-size:10px;
  font-weight:750;letter-spacing:.14em;text-transform:uppercase}
.catalog-card .quick{opacity:1;transform:none}
.catalog-card .poster{border-color:color-mix(in srgb,var(--accent) 22%,var(--line))}
.catalog-card .quick button[disabled]{background:rgba(0,0,0,.55);color:rgba(255,255,255,.58);cursor:default}

/* ---------- overlay / drawer / modal ---------- */
.overlay{
  position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);
  display:none;
}
.overlay.on{display:block}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);z-index:70;background:var(--bg2);
  border-left:1px solid var(--line);overflow-y:auto;transform:translateX(102%);
  transition:transform .24s cubic-bezier(.4,0,.2,1);
}
.drawer.on{transform:none}
.modal{
  position:fixed;z-index:70;top:50%;left:50%;transform:translate(-50%,-46%) scale(.98);opacity:0;
  pointer-events:none;width:min(560px,calc(100% - 32px));max-height:86vh;overflow-y:auto;
  background:var(--bg2);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
  transition:.18s opacity,.18s transform;
}
.modal.on{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}
.sheet-head{
  position:sticky;top:0;background:var(--bg2);z-index:2;padding:16px 18px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;
}
.sheet-head h3{margin:0;font-size:15px;font-weight:650;flex:1}
.sheet-body{padding:18px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--fg3);margin-bottom:6px;font-weight:600}
.field input,.field select,.field textarea{
  width:100%;padding:9px 11px;border-radius:10px;background:var(--panel);border:1px solid var(--line);outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:78px;line-height:1.55}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.field,.two>*,.three>*{min-width:0}

.hero{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--panel2)}
.hero img{width:100%;height:100%;object-fit:cover;filter:blur(18px) saturate(1.3);transform:scale(1.2);opacity:.5}
.hero .front{
  position:absolute;inset:0;display:flex;align-items:flex-end;gap:14px;padding:16px;
  background:linear-gradient(to top,var(--bg2),transparent 78%);
}
.hero .front .p{width:84px;aspect-ratio:2/3;border-radius:10px;overflow:hidden;flex:0 0 auto;
  box-shadow:var(--shadow);border:1px solid var(--line2);position:relative}
.hero .front h2{margin:0 0 4px;font-size:19px;line-height:1.25;letter-spacing:-.01em}
.hero .front .sub{font-size:12.5px;color:var(--fg2)}

.seg{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1;padding:7px 4px;border-radius:7px;font-size:12.5px;color:var(--fg2);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--c,var(--panel2));color:#fff}
html[data-theme="light"] .seg button[aria-pressed="true"]{color:#fff}
.seg button:not([aria-pressed="true"]){color:var(--fg2)}
.seg button:not([aria-pressed="true"]) .lucide{color:color-mix(in srgb,var(--c) 72%,var(--fg2))}
.seg button[data-status="suggested"][aria-pressed="true"]{background:var(--suggested);color:var(--suggested-ink);box-shadow:inset 0 0 0 1px color-mix(in srgb,white 24%,transparent)}
.seg button[data-status="done"][aria-pressed="true"]{background:var(--done);color:var(--done-ink);box-shadow:inset 0 0 0 1px color-mix(in srgb,white 24%,transparent)}
.seg button[data-status="waiting"][aria-pressed="true"]{background:var(--waiting);color:var(--waiting-ink);box-shadow:inset 0 0 0 1px color-mix(in srgb,white 28%,transparent)}
.seg button[data-status="done"] .lucide{stroke-width:2.5}
.seg button[data-status="waiting"] .lucide{stroke-width:2.2}

.stars{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.stars button{min-width:28px;height:28px;padding:0 6px;border:1px solid var(--line);border-radius:7px;background:var(--panel);font-size:11px;color:var(--fg3);line-height:1}
.stars button.on{color:var(--accent)}
.stars .val{margin-left:8px;font-size:12.5px;color:var(--fg3);font-variant-numeric:tabular-nums}

.covers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.covers button{aspect-ratio:2/3;border-radius:8px;overflow:hidden;border:2px solid transparent;background:var(--panel2)}
.covers button:hover{border-color:var(--accent)}
.covers img{width:100%;height:100%;object-fit:cover;display:block}

.hint{font-size:12px;color:var(--fg3);line-height:1.5}
.stat-strip{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 0}
.stat{flex:1 1 90px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.stat b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--fg3);letter-spacing:.06em;text-transform:uppercase}

.meter{height:6px;border-radius:99px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--done),var(--accent),#ff5252)}

#toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,120%);z-index:90;
  background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:11px 14px;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;font-size:13.5px;
  transition:transform .22s cubic-bezier(.4,0,.2,1);max-width:calc(100% - 32px);
}
#toast.on{transform:translate(-50%,0)}

footer.foot{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);color:var(--fg3);font-size:12px;
  display:flex;gap:14px;align-items:center;flex-wrap:wrap}

@media (max-width:640px){
  .wrap{padding:0 14px 80px}
  .top .row{padding:10px 14px;gap:9px}
  .brand small{display:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:13px}
  .resume{flex-basis:265px}
  .three{grid-template-columns:1fr 1fr}
}

/* ============================================================
   2026 redesign | projection-booth program index
   ============================================================ */
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 72%,white);outline-offset:3px}
html{scrollbar-color:var(--line2) var(--bg);scrollbar-width:thin}
body{min-width:320px}
body.sheet-open{overflow:hidden}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.wrap,.top .row{max-width:1440px}
.wrap{padding-inline:30px}

header.top{
  background:color-mix(in srgb,var(--bg) 90%,transparent);
  border-color:color-mix(in srgb,var(--line) 80%,transparent);
}
.top .row{min-height:66px;padding:11px 30px;gap:10px;flex-wrap:nowrap}
.brand{color:var(--fg);text-decoration:none;gap:9px;min-width:max-content}
.brand img{width:31px;height:31px;display:block}
.brand span{font-family:"Reel Display",sans-serif;font-size:26px;line-height:1;letter-spacing:.01em;text-transform:uppercase}
.brand small{font-size:10px;letter-spacing:.11em;color:var(--fg3)}
.search{margin-inline:12px}
.search input{
  min-height:42px;padding:10px 42px 10px 14px;border-radius:12px;
  background:color-mix(in srgb,var(--panel) 88%,transparent);
  transition:border-color 160ms var(--ease-out),box-shadow 160ms var(--ease-out),background-color 160ms ease;
}
.search input::placeholder{color:var(--fg3);opacity:1}
.search input:focus{border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.search kbd{border-radius:6px}
.btn,.icon-btn{
  min-height:38px;border-radius:11px;font-weight:650;
  transition:transform 140ms var(--ease-out),border-color 160ms ease,background-color 160ms ease,color 160ms ease,filter 160ms ease;
}
.mobile-menu-trigger,.mobile-menu{display:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 8px 22px -14px rgba(0,0,0,.72)}
.btn:active,.icon-btn:active,.tabs button:active,.chip:active,.catalog-type-filters button:active,.catalog-card:active{transform:scale(.97)}
.icon-btn{width:38px;height:38px}

section.shelf{margin:32px 0 14px}
.shelf-head{margin-bottom:12px;align-items:center}
.shelf-head h2{
  font-family:"Reel Display",sans-serif;font-size:29px;line-height:1;text-transform:none;
  letter-spacing:.015em;color:var(--fg);font-weight:600;
}
.shelf-head .count{font-variant-numeric:tabular-nums;color:var(--fg3)}
.rail{gap:12px;padding-bottom:10px}
.resume{flex-basis:318px;border-radius:var(--r);box-shadow:none;padding:10px;background:color-mix(in srgb,var(--panel) 92%,transparent)}
.resume .at{color:var(--accent);font-family:"Reel Display",sans-serif;font-size:22px;letter-spacing:.01em}
.empty-shelf{min-height:92px;border-style:solid;background:var(--panel);color:var(--fg2)}

.filters{margin:24px 0 20px;padding-top:18px;column-gap:12px;row-gap:10px}
.tabs{max-width:100%;overflow:visible;border-radius:11px}
.tabs button{min-height:36px;padding:7px 8px;border-radius:8px;white-space:nowrap;transition:transform 140ms var(--ease-out),background-color 160ms ease,color 160ms ease}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg);box-shadow:none}
.tabs button[aria-selected="true"] .n{color:color-mix(in srgb,var(--bg) 68%,transparent)}
.tabs button[data-type="catalog"]{border-left:0;margin-left:0;padding-left:8px;box-shadow:none}
.tabs button[data-type="catalog"] .n{color:var(--accent)}
.tabs button[data-type="catalog"][aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs button[data-type="catalog"][aria-selected="true"] .n{color:color-mix(in srgb,var(--accent-ink) 72%,transparent)}
html[data-theme="light"] .tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
html[data-theme="light"] .tabs button[aria-selected="true"] .n{color:color-mix(in srgb,var(--bg) 68%,transparent)}
.chips{gap:5px}
.chip{border-radius:9px;padding:6px 9px;background:transparent;transition:transform 140ms var(--ease-out),background-color 160ms ease,border-color 160ms ease,color 160ms ease}
.chip .swatch{width:6px;height:6px}
select.mini,.catalog-select select{min-height:38px;border-radius:10px;outline:none;color:var(--fg);transition:border-color 160ms ease,box-shadow 160ms ease}
select.mini:focus,.catalog-select select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}

.grid{gap:22px 18px;grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
.card{border-radius:var(--r);transition:transform 200ms var(--ease-out)}
.poster{box-shadow:var(--shadow);isolation:isolate;background:var(--panel2)}
.poster img{position:relative;z-index:1;transition:filter 180ms ease,transform 220ms var(--ease-out)}
.poster .veil,.poster .pin,.poster .genre,.poster .quick,.poster .pbar,.poster .initials{z-index:2}
.card .tag{display:none}
.poster .veil{height:36%;background:linear-gradient(to top,rgba(5,7,13,.82),transparent)}
.quick{opacity:1;transform:none;inset:auto 8px 8px 8px;justify-content:flex-end}
.quick button{padding:6px 9px;border-radius:8px;background:rgba(13,15,22,.80);border-color:rgba(255,255,255,.24);transition:transform 140ms var(--ease-out),background-color 160ms ease,color 160ms ease}
.quick button:active{transform:scale(.96)}
.genre{display:none}
.cmeta{padding:11px 1px 0}
.cmeta .card-overline{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;color:var(--fg3);font-size:10px;font-weight:750;letter-spacing:.08em;text-transform:uppercase}
.cmeta .card-overline .status-label{text-transform:none;letter-spacing:0;font-weight:600}
.cmeta h3{font-size:14px;line-height:1.34;font-weight:700;letter-spacing:-.015em}
.cmeta p{font-size:11.5px;color:var(--fg3);margin-top:4px}
.grid.list .card{
  display:grid;grid-template-columns:88px minmax(210px,1.05fr) minmax(420px,1.7fr) auto;
  gap:18px;align-items:center;border-radius:var(--r);padding:12px 14px 12px 12px;background:var(--panel);
  transition:border-color 160ms ease,transform 140ms var(--ease-out)
}
.grid.list .poster{width:88px;border-radius:var(--r)}
.grid.list .cmeta{align-self:center}
.grid.list .cmeta .card-overline{justify-content:flex-start}
.grid.list .cmeta h3{-webkit-line-clamp:2;font-size:22px;line-height:1.12;margin-bottom:5px}
.grid.list .cmeta p{font-size:12.5px}
.grid.list .list-summary{
  display:-webkit-box;margin:9px 0 0;color:var(--fg2);font-size:15px;line-height:1.48;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden
}
.grid.list .list-facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:start}
.grid.list .list-fact{min-width:0;padding-inline:12px;border-inline-start:1px solid var(--line)}
.grid.list .list-fact:first-child{border-inline-start:0;padding-inline-start:0}
.grid.list .list-fact small{display:block;margin-bottom:5px;color:var(--fg3);font-size:10px;font-weight:750;letter-spacing:.08em;text-transform:uppercase}
.grid.list .list-fact b{display:block;overflow:hidden;color:var(--fg);font-size:15px;font-weight:650;line-height:1.4;text-overflow:ellipsis;white-space:nowrap}
.grid.list .list-action{display:flex;justify-content:flex-end}
.grid.list .list-action .btn{min-width:94px;justify-content:center}

.catalog-tools{
  margin:6px 0 26px;padding:24px;border:1px solid var(--line);border-radius:16px;background:var(--panel);
  display:grid;grid-template-columns:minmax(220px,320px) minmax(0,1fr);gap:28px;align-items:end;
}
.catalog-heading h2{margin:0;font-family:"Reel Display",sans-serif;font-size:45px;line-height:.9;letter-spacing:.01em;text-transform:uppercase}
.catalog-heading p{margin:10px 0 0;color:var(--fg2);max-width:38ch;font-size:13px}
.catalog-control-deck{display:flex;justify-content:flex-end;align-items:flex-end;gap:10px;flex-wrap:wrap;min-width:0}
.catalog-type-filters{display:flex;gap:4px;flex-wrap:wrap;padding:3px;border:1px solid var(--line);background:var(--bg2);border-radius:11px}
.catalog-type-filters button{min-height:34px;padding:7px 10px;border-radius:8px;color:var(--fg2);font-size:12px;font-weight:700;transition:transform 140ms var(--ease-out),background-color 160ms ease,color 160ms ease}
.catalog-type-filters button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
.catalog-select{display:grid;gap:5px;color:var(--fg3);font-size:10px;font-weight:750;letter-spacing:.08em;text-transform:uppercase}
.catalog-select select{min-width:132px;padding:7px 30px 7px 9px;background:var(--bg2);border:1px solid var(--line);letter-spacing:0;text-transform:none;font-size:12px;font-weight:600}
.grid.catalog-results{display:block}
.catalog-group{margin:0 0 34px}
.catalog-group-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.catalog-group-head h2{margin:0;font-family:"Reel Display",sans-serif;font-size:28px;line-height:1;letter-spacing:.01em}
.catalog-group-head span{color:var(--fg3);font-size:12px;font-variant-numeric:tabular-nums}
.catalog-row{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 14px;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.catalog-row .catalog-card{flex:0 0 178px;scroll-snap-align:start}
.catalog-card{cursor:pointer;min-width:0}
.catalog-card .poster{border-color:var(--line)}
.catalog-card .quick button[disabled]{background:rgba(13,15,22,.74);color:rgba(255,255,255,.66)}
.catalog-card .public-score{color:var(--fg);font-variant-numeric:tabular-nums}
.catalog-empty{max-width:none;min-height:250px;margin:0;border-style:solid;border-radius:16px;background:var(--panel);display:grid;place-items:center;padding:40px}
.catalog-empty-inner{max-width:540px;text-align:left}
.catalog-empty h2{margin:0 0 8px;font-family:"Reel Display",sans-serif;font-size:34px;line-height:1;color:var(--fg)}
.catalog-empty p{margin:0;color:var(--fg2)}
.catalog-empty .btn{margin-top:18px}
.catalog-loading{display:grid;gap:28px}
.catalog-loading-copy{display:flex;align-items:center;gap:13px;color:var(--fg2)}
.catalog-loading-copy b{display:block;color:var(--fg);font-size:15px}
.catalog-loading-copy span{display:block;font-size:12px;margin-top:2px}
.exposure-loader{position:relative;width:40px;height:40px;flex:0 0 auto;border-radius:50%;background:conic-gradient(from 20deg,transparent 0 36%,color-mix(in srgb,var(--accent) 35%,transparent) 54%,var(--accent) 94%,transparent 100%);animation:reelSpin 760ms linear infinite}
.exposure-loader::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--bg2);box-shadow:inset 0 0 0 1px var(--line)}
.exposure-loader::after{content:"";position:absolute;left:50%;top:0;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px color-mix(in srgb,var(--accent) 68%,transparent);transform:translateX(-50%)}
.catalog-skeleton-row{display:flex;gap:14px;overflow:hidden}
.catalog-skeleton-card{flex:0 0 178px}
.catalog-skeleton-poster{position:relative;aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:var(--panel2)}
.catalog-skeleton-poster::after{content:"";position:absolute;inset:10px;border:1px solid color-mix(in srgb,var(--fg) 14%,transparent);border-radius:10px;opacity:.32;animation:skeletonFocus 900ms ease-in-out infinite alternate}
.catalog-skeleton-line{height:10px;width:72%;margin-top:11px;border-radius:5px;background:var(--panel2)}
.catalog-skeleton-line.short{width:45%;height:8px;margin-top:7px}
@keyframes reelSpin{to{transform:rotate(1turn)}}
@keyframes skeletonFocus{to{opacity:.82}}

.drawer{width:min(590px,100%);background:var(--bg2);transition:transform 260ms cubic-bezier(.32,.72,0,1)}
.overlay{background:rgba(6,8,14,.66)}
.sheet-head{min-height:62px;padding-inline:22px}
.sheet-head h3{font-family:"Reel Display",sans-serif;font-size:22px;letter-spacing:.01em}
.sheet-body{padding:22px}
.catalog-detail-hero{position:relative;isolation:isolate;display:grid;grid-template-columns:180px 1fr;gap:22px;align-items:end;padding:22px;border-bottom:1px solid var(--line);overflow:hidden;background:var(--panel)}
.catalog-detail-hero::before{content:"";position:absolute;z-index:-2;inset:0;background-image:var(--detail-banner);background-size:cover;background-position:center 28%;opacity:.48}
.catalog-detail-hero::after{content:"";position:absolute;z-index:-1;inset:0;background:linear-gradient(90deg,color-mix(in srgb,var(--panel) 52%,transparent),var(--panel) 88%)}
.catalog-detail-cover{width:180px;aspect-ratio:2/3;border-radius:14px;overflow:hidden}
.catalog-detail-copy{min-width:0}
.catalog-detail-type{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.catalog-detail-copy h2{margin:7px 0 9px;font-family:"Reel Display",sans-serif;font-size:42px;line-height:.94;letter-spacing:.005em}
.catalog-detail-copy p{margin:0;color:var(--fg2);font-size:13px}
.catalog-detail-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.detail-facts{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-bottom:26px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.detail-fact{min-height:82px;padding:12px;background:var(--panel)}
.detail-fact dt{color:var(--fg3);font-size:10px;font-weight:750;letter-spacing:.08em;text-transform:uppercase}
.detail-fact dd{margin:8px 0 0;font-family:"Reel Display",sans-serif;font-size:22px;line-height:1;color:var(--fg);font-variant-numeric:tabular-nums}
.detail-section{margin:0 0 26px}
.detail-section h3{margin:0 0 10px;font-family:"Reel Display",sans-serif;font-size:22px;letter-spacing:.01em}
.detail-section p{margin:0;color:var(--fg2);line-height:1.7}
.detail-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px 20px}
.detail-meta div{min-width:0}
.detail-meta dt{color:var(--fg3);font-size:10px;font-weight:750;letter-spacing:.08em;text-transform:uppercase}
.detail-meta dd{margin:3px 0 0;color:var(--fg);overflow-wrap:anywhere}
.detail-chips{display:flex;flex-wrap:wrap;gap:7px}
.detail-chips span{padding:6px 9px;border-radius:9px;background:var(--panel);border:1px solid var(--line);font-size:12px;color:var(--fg2)}
.detail-loading{padding:30px 22px}
.detail-source{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.detail-source p{margin:0;color:var(--fg2);font-size:12px}
.detail-source a{text-decoration:none;white-space:nowrap}
.btn{text-decoration:none}

/* ---------- interaction upgrade ---------- */
.lucide{width:16px;height:16px;stroke-width:2;flex:0 0 auto;pointer-events:none}
.btn .lucide,.icon-btn .lucide{transition:transform 160ms var(--ease-out),color 160ms ease}
.pick-button{
  color:#07141b;border-color:transparent;
  background:linear-gradient(110deg,#77e8ff 0%,#ffe06c 54%,#ff9b62 100%);
  box-shadow:0 8px 24px -16px rgba(119,232,255,.8);
}
.pick-button .lucide{color:#1d4ed8;fill:rgba(255,255,255,.36)}
.search-clear{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:28px;height:28px;padding:0;border-radius:8px;display:block;line-height:0;color:var(--fg2);cursor:pointer;transition:background-color 140ms ease,color 140ms ease,transform 140ms var(--ease-out)}
.search-clear .lucide,.search-clear [data-lucide]{position:absolute;left:50%;top:50%;margin:0;transform:translate(-50%,-50%)}
.search-clear:active{transform:translateY(-50%) scale(.94)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.search.has-value kbd{display:none}
.mobile-menu button{display:flex;align-items:center;gap:10px}
.quick button,.seg button{display:inline-flex;align-items:center;justify-content:center;gap:5px}
.quick button:last-child:not(:first-child){padding-inline:7px}
.drawer{overflow-x:hidden}
.sheet-head h3{min-width:0}.sheet-head .btn{flex:0 0 auto}
.seg{overflow:hidden}.seg button{min-width:0;line-height:1.15}
.resume,.resume .thumb,.zoomable,[data-zoom-src]{cursor:pointer}

/* iOS-style liquid shared selection: one capsule keeps its identity as it moves. */
.tabs,.catalog-type-filters{position:relative;isolation:isolate}
.tab-indicator{
  position:absolute;z-index:0;left:0;top:0;width:100px;height:var(--tab-height,36px);border-radius:8px;
  background:var(--fg);box-shadow:0 1px 0 color-mix(in srgb,var(--bg) 15%,transparent) inset,0 4px 14px -9px rgba(0,0,0,.62);
  transform-origin:left center;transform:translate(var(--tab-x,3px),var(--tab-y,3px)) scaleX(var(--tab-scale,.8));
  transition:transform 280ms var(--ease-move),background-color 180ms ease,box-shadow 180ms ease;
  will-change:transform;pointer-events:none
}
.tab-indicator::before{
  content:"";position:absolute;inset:14% 8%;border-radius:inherit;background:inherit;opacity:0;
  filter:blur(1.4px);pointer-events:none
}
.tabs[data-tab-direction="right"] .tab-indicator::before,.catalog-type-filters[data-tab-direction="right"] .tab-indicator::before{transform-origin:right center}
.tabs[data-tab-direction="left"] .tab-indicator::before,.catalog-type-filters[data-tab-direction="left"] .tab-indicator::before{transform-origin:left center}
.tabs[data-tab-direction="right"] .tab-indicator.is-liquid-moving::before,.catalog-type-filters[data-tab-direction="right"] .tab-indicator.is-liquid-moving::before{animation:tabLiquidRight 280ms var(--ease-out) both}
.tabs[data-tab-direction="left"] .tab-indicator.is-liquid-moving::before,.catalog-type-filters[data-tab-direction="left"] .tab-indicator.is-liquid-moving::before{animation:tabLiquidLeft 280ms var(--ease-out) both}
.tabs button,.catalog-type-filters button{position:relative;z-index:1}
.tabs button,.catalog-type-filters button{transition:transform 140ms var(--ease-out),background-color 160ms ease,color 110ms ease}
.tabs button>.lucide,.catalog-type-filters button>.lucide,.tabs button>span:first-of-type,.catalog-type-filters button>span:first-of-type{transform-origin:center;will-change:transform;transition:color 110ms ease,opacity 110ms ease}
.tabs button[data-tab-leaving="true"],.catalog-type-filters button[data-tab-leaving="true"]{color:var(--tab-leaving-color,var(--bg))}
.tabs[data-tab-direction="right"] button[data-tab-entering="true"]>.lucide,.tabs[data-tab-direction="right"] button[data-tab-entering="true"]>span:first-of-type,.catalog-type-filters[data-tab-direction="right"] button[data-tab-entering="true"]>.lucide,.catalog-type-filters[data-tab-direction="right"] button[data-tab-entering="true"]>span:first-of-type{animation:tabInkArriveRight 280ms var(--ease-out) both}
.tabs[data-tab-direction="left"] button[data-tab-entering="true"]>.lucide,.tabs[data-tab-direction="left"] button[data-tab-entering="true"]>span:first-of-type,.catalog-type-filters[data-tab-direction="left"] button[data-tab-entering="true"]>.lucide,.catalog-type-filters[data-tab-direction="left"] button[data-tab-entering="true"]>span:first-of-type{animation:tabInkArriveLeft 280ms var(--ease-out) both}
.tabs[data-tab-direction="right"] button[data-tab-leaving="true"]>.lucide,.tabs[data-tab-direction="right"] button[data-tab-leaving="true"]>span:first-of-type,.catalog-type-filters[data-tab-direction="right"] button[data-tab-leaving="true"]>.lucide,.catalog-type-filters[data-tab-direction="right"] button[data-tab-leaving="true"]>span:first-of-type{animation:tabInkReleaseRight 220ms var(--ease-out) both}
.tabs[data-tab-direction="left"] button[data-tab-leaving="true"]>.lucide,.tabs[data-tab-direction="left"] button[data-tab-leaving="true"]>span:first-of-type,.catalog-type-filters[data-tab-direction="left"] button[data-tab-leaving="true"]>.lucide,.catalog-type-filters[data-tab-direction="left"] button[data-tab-leaving="true"]>span:first-of-type{animation:tabInkReleaseLeft 220ms var(--ease-out) both}
.tabs button[aria-selected="true"],html[data-theme="light"] .tabs button[aria-selected="true"],.catalog-type-filters button[aria-pressed="true"]{background:transparent;box-shadow:none}
.tabs button[aria-selected="true"]{color:var(--bg)}
.tabs:has(button[data-type="catalog"][aria-selected="true"]) .tab-indicator{background:var(--accent)}
.tabs:has(button[data-type="catalog"][aria-selected="true"]) button[aria-selected="true"]{color:var(--accent-ink)}
.tabs button[data-type="catalog"]:not([aria-selected="true"]){
  color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 34%,transparent)
}
.tabs button[data-type="catalog"]:not([aria-selected="true"]):hover{background:color-mix(in srgb,var(--accent) 15%,transparent)}
.tabs button[data-type="catalog"] .n{
  padding:2px 5px;border-radius:8px;background:color-mix(in srgb,var(--accent) 16%,transparent);
  color:var(--accent);font-weight:750;letter-spacing:.04em;text-transform:uppercase
}
.tabs button[data-type="catalog"][aria-selected="true"] .n{background:color-mix(in srgb,var(--accent-ink) 16%,transparent);color:var(--accent-ink)}
.catalog-type-filters button[aria-pressed="true"]{color:var(--bg)}
.catalog-type-filters{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));width:100%;min-width:0;overflow:visible}
.catalog-type-filters::-webkit-scrollbar{display:none}
.catalog-type-filters button{display:flex;align-items:center;justify-content:center;gap:6px;min-width:0;white-space:normal;overflow-wrap:anywhere}
@keyframes tabLiquidRight{
  0%{opacity:0;transform:translateX(0) scaleX(.72)}
  30%{opacity:.48;transform:translateX(-9%) scaleX(1.24)}
  56%{opacity:.82;transform:translateX(-18%) scaleX(var(--liquid-stretch,1.65))}
  82%{opacity:.24;transform:translateX(-4%) scaleX(1.08)}
  100%{opacity:0;transform:translateX(0) scaleX(.76)}
}
@keyframes tabLiquidLeft{
  0%{opacity:0;transform:translateX(0) scaleX(.72)}
  30%{opacity:.48;transform:translateX(9%) scaleX(1.24)}
  56%{opacity:.82;transform:translateX(18%) scaleX(var(--liquid-stretch,1.65))}
  82%{opacity:.24;transform:translateX(4%) scaleX(1.08)}
  100%{opacity:0;transform:translateX(0) scaleX(.76)}
}

/* Filter pills fill from left to right to make selection unmistakable. */

/* The old .hero img rule blurred the poster as well as the backdrop. */

/* Compact, full-width control groups keep clear-filter changes in their own row. */
.filters{grid-template-columns:minmax(0,1fr);grid-template-areas:"tabs" "chips" "actions";gap:10px}
.filters>.chips{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));overflow:visible;padding:0}
.filters>.chips .chip{justify-content:center;white-space:normal;min-height:40px;padding:7px 8px;color:var(--fg2);border-color:var(--line);font-weight:550}
.filters>.chips .chip:hover{color:var(--fg);border-color:color-mix(in srgb,var(--c) 28%,var(--line));background:color-mix(in srgb,var(--c) 5%,transparent)}
.filters>.chips .chip[aria-pressed="true"]{color:var(--fg);border-color:color-mix(in srgb,var(--c) 68%,var(--line));font-weight:700;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 18%,transparent)}
.filters>.chips .chip[aria-pressed="true"] .lucide{color:var(--c)}
.filter-actions{display:flex;justify-self:stretch;justify-content:stretch;flex-wrap:nowrap;width:100%;gap:8px}
.filter-actions .mini-select-host{flex:1 1 0;min-width:0;max-width:none;width:0!important}
.filter-actions .smart-select-trigger{min-width:0;width:100%}
.filter-actions .btn{flex:0 0 auto}
.tabs button .tab-copy{display:flex;align-items:center;justify-content:center;gap:5px;min-width:0}
.tabs button .n{display:inline;font-size:10px;font-weight:500}
.progress-tracker{margin:20px 0 24px;padding-block:18px;border-block:1px solid var(--line)}

.progress-tracker>.hint{margin:6px 0 14px;line-height:1.6;color:var(--fg2)}
.progress-input{display:flex;align-items:center;gap:10px;min-width:0;border:1px solid var(--line2);border-radius:10px;padding-inline-end:10px;background:var(--panel)}
.progress-input:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.progress-input input{flex:0 0 72px;width:72px;min-width:0;border:0;background:transparent;font-size:20px;font-variant-numeric:tabular-nums;box-shadow:none}
.progress-input input:focus{outline:none;box-shadow:none}
.progress-input span{font-size:12px;color:var(--fg2);overflow-wrap:anywhere;line-height:1.45}
.tracking-actions{display:flex;gap:6px;flex-wrap:wrap}
.tracking-actions button{min-height:40px}
.waiting-help{line-height:1.6;color:var(--waiting);margin:10px 0 0;padding:10px 12px;border-radius:9px;background:color-mix(in srgb,var(--waiting) 10%,var(--panel));border:1px solid color-mix(in srgb,var(--waiting) 35%,var(--line))}
.seg [data-status="waiting"]{grid-column:1/-1}
.labeled-facts{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px}

/* One-line tab rail: wide screens distribute evenly, narrow screens scroll without wrapping. */
.tabs{
  display:flex;grid-template-columns:none;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding-inline:3px;overscroll-behavior-inline:contain

/* Every card uses one clean edge-to-edge image plane. Preserve the source aspect ratio,
   crop proportionally from the center, and leave the full original to the detail viewer. */
.poster img{object-fit:cover;object-position:center;padding:0;filter:none;image-rendering:auto}

/* These two verified cover files include a white marketplace mat inside the JPEG.
   A precise optical crop removes only that mat while keeping the cover artwork intact. */
.poster img[src$="/03-amanos.jpg"]{transform:scale(1.24)}
.poster img[src$="/04-quickol.jpg"]{transform:scale(1.19)}
.card:hover .poster img[src$="/03-amanos.jpg"]{transform:scale(1.26)}
.card:hover .poster img[src$="/04-quickol.jpg"]{transform:scale(1.21)}

/* The trigger and menu now open as one anchored surface on one shared timeline. */
.smart-select-trigger{
  transition:transform 140ms var(--ease-out),border-radius 220ms var(--ease-in-out),border-color 160ms ease,box-shadow 160ms ease,background-color 160ms ease
}
.smart-select-trigger[aria-expanded="true"]{border-radius:999px}
.smart-select[data-menu-open="true"] .smart-select-trigger[data-menu-direction="down"]{border-radius:10px 10px 0 0;border-bottom-color:var(--line2)}
.smart-select[data-menu-open="true"] .smart-select-trigger[data-menu-direction="up"]{border-radius:0 0 10px 10px;border-top-color:var(--line2)}
.smart-select .smart-select-trigger[data-menu-closing="true"][data-menu-direction]{border-radius:999px;border-color:var(--accent)}
.smart-select-menu,.smart-select-menu[data-direction="up"]{
  opacity:0;clip-path:inset(0);pointer-events:none;will-change:opacity,transform;
  transition:opacity 220ms var(--ease-out),transform 220ms var(--ease-out)
}
.smart-select-menu[data-direction="down"]{transform:translateY(-4px) scale(.985);transform-origin:top center}
.smart-select-menu[data-direction="up"]{transform:translateY(4px) scale(.985);transform-origin:bottom center}
.smart-select-menu[data-open="true"],.smart-select-menu[data-direction="up"][data-open="true"]{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}

.settings-tabs{margin-top:22px}

<body>
<div id="pageTop" aria-hidden="true" style="height:1px"></div>
<!--
THESIS: Reel is a personal program index, not a streaming clone. It replaces the undifferentiated poster wall with clear shelves, source-aware detail, and direct progress actions.
OWN-WORLD: Carbon and cool-paper surfaces, one cobalt signal color, condensed program typography, 14px media frames, crisp rules, and dense but breathable controls.
STORY: Users see what is active, move between their library and the wider catalog, narrow the catalog, compare titles, inspect the full record, and add with confidence.
FIRST VIEWPORT: A compact one-line brand and action bar leads into the Continue shelf, then a strong tab rail and image-led collection. All titles opens with its own filter console and consecutive medium shelves.
FORM: Projection-booth program index, assigned grounded direction 7, seed 99aec0e2.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->
<header class="top">
  <div class="row">
    <a class="brand" href="#" aria-label="Reel home"><img src="assets/reel-mark.svg" alt=""><span>reel</span><small>your media index</small></a>
    <div class="search">
      <input id="q" type="search" aria-label="Search" placeholder="Search your library" autocomplete="off">
      <kbd>/</kbd>
      <button class="search-clear" id="clearSearch" type="button" aria-label="Clear search" title="Clear search" hidden><i data-lucide="x" aria-hidden="true"></i></button>
    </div>
    <button class="btn pick-button" id="btnPick" title="Decide for me"><i data-lucide="sparkles" aria-hidden="true"></i><span>Pick for me</span></button>
    <button class="btn" id="btnAdd" aria-label="Add title" title="Add title"><i data-lucide="plus" aria-hidden="true"></i><span>Add title</span></button>
    <button class="btn ghost mobile-menu-trigger" id="btnMobileMenu" aria-haspopup="menu" aria-expanded="false" aria-controls="mobileMenu"><i data-lucide="menu" aria-hidden="true"></i><span>Menu</span></button>
    <button class="btn ghost secondary-action" id="btnPaste" title="Paste a list of titles"><i data-lucide="list-plus" aria-hidden="true"></i><span>Import</span></button>
    <button class="btn ghost secondary-action" id="btnCovers" title="Fetch missing posters, genres and runtimes"><i data-lucide="wand-sparkles" aria-hidden="true"></i><span>Enrich</span></button>
    <button class="btn ghost utility-action" id="btnTheme" title="Toggle light and dark theme"><i data-lucide="sun-moon" aria-hidden="true"></i><span>Theme</span></button>
    <button class="btn ghost utility-action" id="btnMore" title="Backup and settings"><i data-lucide="settings-2" aria-hidden="true"></i><span>Settings</span></button>
    <div class="mobile-menu" id="mobileMenu" role="menu" aria-label="Reel utilities" hidden>
      <button role="menuitem" data-mobile-action="pick"><i data-lucide="sparkles" aria-hidden="true"></i><span>Pick for me</span></button>
      <button role="menuitem" data-mobile-action="import"><i data-lucide="list-plus" aria-hidden="true"></i><span>Import titles</span></button>
      <button role="menuitem" data-mobile-action="enrich"><i data-lucide="wand-sparkles" aria-hidden="true"></i><span>Enrich missing info</span></button>
      <button role="menuitem" data-mobile-action="theme" id="mobileTheme"><i data-lucide="sun-moon" aria-hidden="true"></i><span>Switch to light</span></button>
      <button role="menuitem" data-mobile-action="settings"><i data-lucide="settings-2" aria-hidden="true"></i><span>Settings and cloud</span></button>
      <button role="menuitem" data-mobile-action="export"><i data-lucide="download" aria-hidden="true"></i><span>Export backup</span></button>
    </div>
  </div>
  <div id="fetchbar"><i></i></div>
</header>

<main class="wrap">
  <h1 class="sr-only">Reel media library</h1>
  <section class="shelf">
    <div class="shelf-head">
      <h2>Continue</h2><span class="count" id="continueCount"></span>
    </div>
    <div class="rail" id="rail"></div>
  </section>

  <div class="filters">
    <div class="tabs" id="typeTabs" role="tablist"></div>
    <div class="chips" id="statusChips"></div>
    <div class="filter-actions">
      <select class="mini" id="genreSel" title="Filter by genre" aria-label="Filter by genre"></select>
      <select class="mini" id="sort" aria-label="Sort your library">
        <option value="updated">Recently touched</option>
        <option value="added">Recently added</option>
        <option value="title">Title A to Z</option>
        <option value="rating">Rating</option>
        <option value="year">Year</option>
      </select>
      <button class="btn ghost clear-filters" id="btnClearFilters" hidden><i data-lucide="filter-x" aria-hidden="true"></i><span>Clear filters</span></button>
      <button class="btn ghost" id="btnView" title="List view" aria-label="List view"><i data-lucide="rows-3" aria-hidden="true"></i><span>List view</span></button>
    </div>
  </div>

  <section class="catalog-tools" id="catalogTools" hidden aria-labelledby="catalogTitle">
    <div class="catalog-heading">
      <h2 id="catalogTitle">All titles</h2>
      <p id="catalogSummary">Search movies, series, anime, and books from four public catalogs.</p>
    </div>
    <div class="catalog-control-deck">
      <div class="catalog-type-filters" id="catalogTypeFilters" role="group" aria-label="Filter catalog by media type">
        <span class="tab-indicator" aria-hidden="true"></span>
        <button data-catalog-type="all" aria-pressed="true"><i data-lucide="layers-3" aria-hidden="true"></i><span>Everything</span></button>
        <button data-catalog-type="movie" aria-pressed="false"><i data-lucide="film" aria-hidden="true"></i><span>Movies</span></button>
        <button data-catalog-type="series" aria-pressed="false"><i data-lucide="tv" aria-hidden="true"></i><span>Series</span></button>
        <button data-catalog-type="anime" aria-pressed="false"><i data-lucide="sparkle" aria-hidden="true"></i><span>Anime</span></button>
        <button data-catalog-type="manga" aria-pressed="false"><i data-lucide="book-open" aria-hidden="true"></i><span>Manga</span></button>
        <button data-catalog-type="manhwa" aria-pressed="false"><i data-lucide="panels-top-left" aria-hidden="true"></i><span>Manhwa</span></button>
        <button data-catalog-type="book" aria-pressed="false"><i data-lucide="library-big" aria-hidden="true"></i><span>Books</span></button>
      </div>
      <label class="catalog-select"><span>Sort by</span>
        <select id="catalogSort">
          <option value="popularity">Popularity</option>
          <option value="rating">Public rating</option>
          <option value="year-desc">Newest year</option>
          <option value="year-asc">Oldest year</option>
          <option value="title">Title A to Z</option>
        </select>
      </label>
      <label class="catalog-select"><span>Release</span>
        <select id="catalogYear">
          <option value="all">Any year</option>
          <option value="2020">2020s</option>
          <option value="2010">2010s</option>
          <option value="2000">2000s</option>
          <option value="1990">1990s</option>
          <option value="classic">Before 1990</option>
        </select>
      </label>
      <button class="btn ghost" id="btnCatalogClear"><i data-lucide="list-filter" aria-hidden="true"></i><span>Clear filters</span></button>
    </div>
  </section>

  <div class="grid" id="grid"></div>

/* ---------- text normalisation ---------- */
const ZW = /[​-‏‪-‮﻿]/g;
const SMALL = new Set(['a','an','and','as','at','but','by','for','in','nor','of','on','or','the','to','vs','via','with','from']);

function clean(s){
  return String(s).replace(ZW,'').replace(/^[\s\-–—•*·»>]+/,'').replace(/\s+/g,' ').trim();
}
function norm(s){
  return clean(s).toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[ؐ-ًؚ-ٰٟۖ-ۭ]/g,'')
    .replace(/[إأآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
    .replace(/[^\p{L}\p{N}]+/gu,' ').trim()
    .replace(/^(the|a|an) /,'');
}
function titleCase(s){
  const words = s.split(' ');
  return words.map((w,i)=>{
    if(/[A-Z]/.test(w)) return w;                       // already styled: Se7en, S.W.A.T., F1
    const bare = w.replace(/[^\p{L}]/gu,'');
    if(i>0 && i<words.length-1 && SMALL.has(bare.toLowerCase())) return w;
    return w.charAt(0).toUpperCase()+w.slice(1);
  }).join(' ');
}

  return {
    season:1, episode:0, page:0, pages:null, chapter:0, chapters:null, stoppedAtSec:0,
    rating:0, fav:false, cover:'', banner:'', notes:'', catalogId:'', castTried:false, castHydrated:false,

/* ---------- item factory & parsing ---------- */
function makeItem(rawTitle, type='movie', status='want'){
  let t = clean(rawTitle);
  if(!t) return null;

  // trailing year: "Life 1999", "the flintstones (1994)"
  let year = null;
  const m = t.match(/[\s(](19|20)\d{2}\)?$/);
  if(m){ year = parseInt(m[0].replace(/[^\d]/g,''),10); t = t.slice(0, m.index).trim(); }

  const fixed = FIXES[norm(t)];
  t = fixed || titleCase(t);
  const key = norm(t);
  type = TYPE_FIX[key] || type;

  return {
    id: uid(), title:t, key, type, status,
    year, season:1, episode:0, page:0, pages:null, chapter:0, chapters:null, stoppedAtSec:0,
    rating:0, fav:false, cover:'', banner:'', notes:'', tags:[],
    genres:[], runtime:null, synopsis:'', creator:'',
    cast:[], score:null, country:'', language:'', showStatus:'', seasons:null, ageRating:'',
    catalogId:'', castTried:false, castHydrated:false, added:now(), updated:now(), finished:null, noCover:false, metaTried:false
  };
}
/** Parse a block of text into items, skipping titles already present. */
function ingest(text, type, status='want'){
  const seen = new Set(state.items.map(i=>`${i.type}|${i.key}|${i.year||''}`));
  const out = [];
  for(const line of String(text).split(/\r?\n/)){
    const it = makeItem(line, type, status);
    const identity = it ? `${it.type}|${it.key}|${it.year||''}` : '';
    if(!it || seen.has(identity)) continue;
    seen.add(identity);
    out.push(it);
  }
  state.items.push(...out);
  return out.length;
}

function seedIfEmpty(){
  if(state.seeded || state.items.length) return;
  let n = 0;
  // Preferred path: the pre-fetched library baked in at build time, so the very first
  // launch already has covers, genres, runtimes and synopses without touching the network.
  const rich = document.getElementById('seed-data');
  if(rich){
    // One shared timestamp: the sort is stable, so an untouched library shows in the
    // order the lists were written rather than reversed by seeding order.
    const t0 = now();
    try{
      for(const r of JSON.parse(rich.textContent)){
        const it = makeItem(r.title, r.type, r.status || 'want');
        if(!it) continue;
        it.added = it.updated = t0;
        if(r.year) it.year = r.year;
        it.cover    = r.cover    || verifiedBookCover(r.title) || '';
        it.genres   = r.genres   || [];

const isEpisodic = it=>['series','anime'].includes(it.type);

function progressPct(it){

function updateTabIndicator(container,activeSelector){
  if(!container) return;
  requestAnimationFrame(()=>{
    const active = container.querySelector(activeSelector);
    const indicator = container.querySelector('.tab-indicator');
    if(!active || !indicator) return;
    const previous=container._activeTab;
    const canAnimate=previous?.isConnected && previous!==active && !matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(canAnimate){
      const buttons=[...container.querySelectorAll('button')];
      const direction=buttons.indexOf(active)>=buttons.indexOf(previous)?'right':'left';
      const distance=Math.hypot(active.offsetLeft-previous.offsetLeft,active.offsetTop-previous.offsetTop);
      container.dataset.tabDirection=direction;
      indicator.style.setProperty('--liquid-stretch',String(Math.min(2.05,1.3+distance/260)));
      container.style.setProperty('--tab-leaving-color',container._activeColor||getComputedStyle(previous).color);
      container.querySelectorAll('[data-tab-leaving],[data-tab-entering]').forEach(button=>{
        button.removeAttribute('data-tab-leaving');button.removeAttribute('data-tab-entering');
      });
      previous.dataset.tabLeaving='true'; active.dataset.tabEntering='true';
      indicator.classList.remove('is-liquid-moving');
      void indicator.offsetWidth;
      indicator.classList.add('is-liquid-moving');
      clearTimeout(container._tabMotionTimer);
      container._tabMotionTimer=setTimeout(()=>{
        previous.removeAttribute('data-tab-leaving');active.removeAttribute('data-tab-entering');
        indicator.classList.remove('is-liquid-moving');
        if(active.isConnected) container._activeColor=getComputedStyle(active).color;
      },290);
    }
    indicator.style.setProperty('--tab-x',`${active.offsetLeft}px`);
    indicator.style.setProperty('--tab-y',`${active.offsetTop}px`);
    indicator.style.setProperty('--tab-height',`${active.offsetHeight}px`);
    indicator.style.setProperty('--tab-scale',String(active.offsetWidth/100));
    container._activeTab=active;
    if(!canAnimate) container._activeColor=getComputedStyle(active).color;
  });
}

  options[index]?.focus({preventScroll:true});
}
function enhanceSelects(root=document){
  $$('.smart-select-menu').forEach(menu=>{ if(menu._smart && !menu._smart.select.isConnected) menu.remove(); });
  $$('select',root).forEach(select=>{
    if(select._smart){ syncSmartSelect(select._smart); return; }
    const host = document.createElement('span');
    host.className = `smart-select ${select.classList.contains('mini')?'mini-select-host':''}`;
    select.before(host); host.append(select);
    const id = `smart-${uid()}`;
    const trigger = document.createElement('button');
    trigger.type='button'; trigger.className='smart-select-trigger'; trigger.setAttribute('aria-haspopup','listbox');
    trigger.setAttribute('aria-expanded','false'); trigger.setAttribute('aria-controls',id);
    trigger.setAttribute('aria-label',select.getAttribute('aria-label') || select.closest('label')?.querySelector('span')?.textContent || 'Select an option');
    trigger.innerHTML = `<span class="smart-select-value"></span>${icon('chevron-down',15)}`;
    host.append(trigger);
    const menu = document.createElement('div');
    menu.id=id; menu.className='smart-select-menu'; menu.setAttribute('role','listbox'); menu.hidden=true;
    host.append(menu);
    const smart = {select,host,trigger,menu,value:trigger.querySelector('.smart-select-value'),signature:''};
    menu._smart=smart;
    select.tabIndex=-1; select.setAttribute('aria-hidden','true');
    select._smart=smart;
    trigger.addEventListener('click',()=>openSmart===smart?closeSmartSelect(true):openSmartSelectMenu(smart));
    trigger.addEventListener('keydown',e=>{
      if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){ e.preventDefault(); openSmartSelectMenu(smart); }
    });
    menu.addEventListener('keydown',e=>{
      const options = $$('.smart-select-option:not([disabled])',menu);
      const at = options.indexOf(document.activeElement);
      if(e.key==='Escape'){ e.preventDefault(); closeSmartSelect(true); return; }
      if(e.key==='Tab'){ closeSmartSelect(); return; }
      if(e.key==='ArrowDown'||e.key==='ArrowUp'){
        e.preventDefault(); const next=(at+(e.key==='ArrowDown'?1:-1)+options.length)%options.length; options[next]?.focus(); highlightSmartOption(smart,+options[next].dataset.index);
      }
      if(e.key==='Home'||e.key==='End'){ e.preventDefault(); const option=e.key==='Home'?options[0]:options.at(-1); option?.focus(); highlightSmartOption(smart,+option.dataset.index); }
    });
    select.addEventListener('change',()=>syncSmartSelect(smart));
    syncSmartSelect(smart);
  });
}

function catalogVisible(){
  let out = [...catalog.results];
  if(catalog.type!=='all') out = out.filter(it=>it.type===catalog.type);
  if(catalog.year!=='all'){
    out = out.filter(it=>{
      if(!it.year) return false;
      if(catalog.year==='classic') return it.year < 1990;
      const start = +catalog.year;
      return it.year >= start && it.year < start + 10;
    });
  }
  const sorters = {
    popularity:(a,b)=>(b.popularity||0)-(a.popularity||0) || (b.score||0)-(a.score||0),
    rating:(a,b)=>(b.score||0)-(a.score||0) || (b.popularity||0)-(a.popularity||0),
    'year-desc':(a,b)=>(b.year||0)-(a.year||0) || a.title.localeCompare(b.title),
    'year-asc':(a,b)=>(a.year||9999)-(b.year||9999) || a.title.localeCompare(b.title),
    title:(a,b)=>a.title.localeCompare(b.title),
  };
  return out.sort(sorters[catalog.sort]||sorters.popularity);
}

function catalogRelevance(record, term){
  const people=(record.cast||[]).map(person=>{const p=normalizePerson(person);return `${p.name} ${p.role}`;}).join(' ');
  const target = norm([record.title,record.creator,record.seriesName,(record.series||[]).join(' '),(record.searchTerms||[]).join(' '),people].join(' ')), wanted = norm(term);
  if(!target || !wanted) return false;
  if(target.includes(wanted) || wanted.includes(target)) return true;
  const words = wanted.split(' ').filter(w=>w.length>1);
  return words.length > 1 && words.filter(w=>target.includes(w)).length / words.length >= .75;
}

/** Every genre in the library, with counts, most common first. */
function genreIndex(scope){
  const m = new Map();
  for(const i of (scope||state.items)) for(const g of i.genres) m.set(g,(m.get(g)||0)+1);
  return [...m.entries()].sort((a,b)=>b[1]-a[1] || a[0].localeCompare(b[0]));
}

function visible(){
  let out = state.items;
  if(filterType!=='all' && filterType!=='catalog') out = out.filter(i=>i.type===filterType);
  if(filterStatus.size)  out = out.filter(i=>filterStatus.has(i.status));
  if(filterGenre)        out = out.filter(i=>i.genres.includes(filterGenre));
  if(query){
    const q = norm(query);
    out = out.filter(i=>{
      const cast=(i.cast||[]).map(person=>{
        const p=normalizePerson(person);return `${p.name} ${p.role}`;
      }).join(' ');
      return norm([i.title,i.creator,i.seriesName,(i.series||[]).join(' '),(i.searchTerms||[]).join(' '),cast,i.synopsis,(i.tags||[]).join(' ')].join(' ')).includes(q);
    });
  }
  const s = state.ui.sort;
  const by = {
    updated:(a,b)=>b.updated-a.updated,
    added:(a,b)=>b.added-a.added,
    title:(a,b)=>a.key.localeCompare(b.key),
    rating:(a,b)=>(b.rating||0)-(a.rating||0) || b.updated-a.updated,
    year:(a,b)=>(b.year||0)-(a.year||0) || a.key.localeCompare(b.key),
  }[s];
  return [...out].sort(by);
}

function watchPositionMarkup(it){

function titleFactsMarkup(it){

function syncTracker(it,d){
  const bounds=progressBounds(it);
  for(const field of ['season','episode']){
    const input=d.querySelector(`[data-f="${field}"]`);if(!input)continue;
    const max=field==='season'?bounds.maxSeason:bounds.maxEpisode;
    input.value=it[field]??(field==='season'?1:0);input.disabled=!(max>0);
    if(max!=null) input.max=String(max);else input.removeAttribute('max');
  }
  const season=d.querySelector('#seasonLimit'),episode=d.querySelector('#episodeLimit');
  if(season)season.textContent=bounds.maxSeason>0?tr('tracking.available',{n:bounds.available?.length||bounds.maxSeason}):tr('tracking.unknown');
  if(episode)episode.textContent=bounds.guide?tr('tracking.seasonEpisodes',{n:bounds.maxEpisode||0,s:it.season||1}):tr('tracking.unknown');
  const next=d.querySelector('#nextSeason'),bumpButton=d.querySelector('#quickBump');
  if(next)next.disabled=!bounds.available?.some(s=>s.number>it.season);
  if(bumpButton&&isEpisodic(it))bumpButton.disabled=!(bounds.maxEpisode>it.episode||bounds.available?.some(s=>s.number>it.season));

function wireDrawer(it, d){

    it.updated=now();
    refreshLibrarySurfaces({genres,rail,grid,counts});
  };

  const updateField=e=>{
    const f = e.target.dataset.f; if(!f) return;
    let v = e.target.value;
    if(f==='year'||f==='page'||f==='pages'||f==='chapter'||f==='chapters'||f==='season'||f==='episode'||f==='runtime'){
      v = v===''? (f==='page'||f==='chapter'||f==='season'||f==='episode'? 0 : null) : parseInt(v,10);
      if(Number.isNaN(v)) v = null;
    }
    if(f==='tags') v = v.split(',').map(s=>s.trim()).filter(Boolean);
    if(f==='genres'){ it.genres = tidyGenres(v.split(',').map(s=>s.trim()).filter(Boolean));
                      it.updated = now(); save(); renderGenres(); renderGrid(); return; }
    if(f==='title'){ it.title = v; it.key = norm(v); it.updated = now(); save(); renderGrid(); renderRail(); return; }
    it[f] = v;

      clampProgress(it);
      syncTracker(it,d);

    if(f==='type') { refreshLibrarySurfaces({genres:true,counts:true}); openItem(it.id); return; }

      const b = e.target.closest('[data-n]'); if(!b) return;
      const c = cands[+b.dataset.n];
      applyMeta(it, c, {force:true}); it.noCover = false; touch(); openItem(it.id);
      await topUp(c); applyMeta(it, c, {force:true});
      touch(); if(openId===it.id) openItem(it.id);
    };
  };

  $('#uploadBtn',d).onclick = ()=>$('#fileInput',d).click();
  $('#fileInput',d).onchange = async e=>{
    const f = e.target.files[0]; if(!f) return;
    it.cover = await shrink(f); it.noCover=false; touch(); openItem(it.id);
  };
}

const stripTags = s => String(s||'').replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim();

/* Genre vocabulary. Longest phrases first so "science fiction" wins over "fiction". */
const GENRE_WORDS = [
  'post-apocalyptic','psychological thriller','romantic comedy','spaghetti western',
  'science fiction','martial arts','coming-of-age','black comedy','comedy-drama',
  'dark comedy','crime thriller','neo-noir','film noir','superhero','supernatural',
  'documentary','biographical','apocalyptic','historical','adventure','animation',
  'animated','political','disaster','gangster','musical','mystery','romance','western',
  'thriller','slasher','fantasy','courtroom','survival','horror','action','comedy',
  'crime','drama','satire','sports','heist','prison','erotic','zombie','family',
  'sci-fi','noir','epic','teen','war','spy'
];
const GENRE_MAP = {
  'science fiction':'Sci-Fi','sci-fi':'Sci-Fi','scifi':'Sci-Fi',
  'animated':'Animation','biographical':'Biography','nonfiction':'Non-fiction',
  'neo-noir':'Noir','film noir':'Noir','noir':'Noir','suspense':'Thriller',
  'comedy-drama':'Comedy|Drama','romantic comedy':'Romance|Comedy',
  'crime thriller':'Crime|Thriller','psychological thriller':'Thriller|Psychological',
  'dark comedy':'Black Comedy','spaghetti western':'Western','kids':'Family',
  'science-fiction':'Sci-Fi','coming-of-age':'Coming-of-age',
};
/* Kitsu tags anime with settings and places as well as genres — these are the real genres. */
const ANIME_GENRES = new Set(['action','adventure','comedy','drama','fantasy','horror','mecha',
  'mystery','romance','sci-fi','science fiction','slice of life','sports','supernatural','thriller',
  'psychological','ecchi','harem','isekai','magic','military','music','historical','demons',
  'vampire','super power','martial arts','samurai','school','shounen','shoujo','seinen','josei',
  'gore','survival','crime','war','police','parody','satire','tragedy','sport','superhero','noir']);
/* Kitsu and Open Library return places, formats and other noise alongside real genres. */
const GENRE_STOP = new Set(['japan','asia','earth','present','united states','fiction','anime','manga',
  'television','tv','film','movie','books','general','accessible book','protected daisy','large type books',
  'in library','reading level','new york times bestseller','fiction in english','english fiction','novel']);

function tidyGenres(list){
  const out = [];
  for(const raw of list){
    const k = String(raw||'').toLowerCase().trim();
    if(!k || k.length>24 || /\d/.test(k) || GENRE_STOP.has(k)) continue;
    for(const part of (GENRE_MAP[k] || k.replace(/\b\w/g,c=>c.toUpperCase())).split('|'))
      if(part && !out.includes(part)) out.push(part);
  }
  return out.slice(0,4);
}
/** Pull genres out of a Wikipedia opening sentence: "…is a 1995 American crime thriller film…" */
function genresFromIntro(text){
  const head = String(text||'').split(/\bfilm\b|\bmovie\b/)[0].toLowerCase().slice(0,220);
  const found = [];
  for(const w of GENRE_WORDS) if(head.includes(w) && !found.includes(w)) found.push(w);
  return tidyGenres(found);
}

/* ---- per-source lookups. Each returns candidates: {cover,genres,year,runtime,pages,synopsis,creator} ---- */
/* Nationality adjectives Wikipedia opens with: "...is a 2003 South Korean action thriller film..." */
const NATIONALITY = {
  'south korean':'South Korea','north korean':'North Korea','american':'United States',
  'british':'United Kingdom','french':'France','japanese':'Japan','chinese':'China',
  'hong kong':'Hong Kong','taiwanese':'Taiwan','indian':'India','german':'Germany',
  'italian':'Italy','spanish':'Spain','mexican':'Mexico','canadian':'Canada',
  'australian':'Australia','irish':'Ireland','russian':'Russia','soviet':'Russia',
  'swedish':'Sweden','danish':'Denmark','norwegian':'Norway','finnish':'Finland',
  'polish':'Poland','brazilian':'Brazil','argentine':'Argentina','turkish':'Turkey',
  'iranian':'Iran','israeli':'Israel','thai':'Thailand','indonesian':'Indonesia',
  'belgian':'Belgium','dutch':'Netherlands','swiss':'Switzerland','austrian':'Austria',
  'new zealand':'New Zealand','scottish':'United Kingdom','egyptian':'Egypt',
};
function countryFromIntro(text){
  const head = String(text||'').split(/\bfilm\b|\bmovie\b/)[0].toLowerCase().slice(0,200);
  let best = '', at = Infinity;
  for(const k in NATIONALITY){
    const i = head.indexOf(k);
    if(i >= 0 && i < at){ at = i; best = NATIONALITY[k]; }
  }
  return best;
}
/** "...and starring Alice Smith, Bob Jones and Carol Ray." -> those names */
function castFromIntro(text){
  const m = String(text||'').match(/\b(?:starring|(?:it|which)\s+stars|stars)\s+([^.]{3,220})/i);
  if(!m) return [];
  return m[1]
    .replace(/\s*\([^)]*\)/g,'')
    .split(/,|\band\b|\bwith\b/)
    .map(x=>x.trim())
    .filter(x=>/^\p{Lu}[\p{L}'.-]*(\s+[\p{L}'.-]+){1,3}$/u.test(x))
    .slice(0,12);
}
function directorFromIntro(text){
  const match=String(text||'').match(/\b(?:written and )?directed by\s+([^.;]{2,120})/i);
  return match ? match[1].replace(/\s+(?:from|and written|with a screenplay).*$/i,'').trim() : '';
}
const PERSON_CACHE = new Map();
async function lookupPerson(name){
  const key = norm(name);
  if(PERSON_CACHE.has(key)) return PERSON_CACHE.get(key);
  let person = {name,image:'',role:'',sourceUrl:'',summary:'',description:''};
  try{
    let d = await getJSON('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(name.replace(/ /g,'_')));
    if(d.type==='disambiguation' || !d.extract){
      const search = await getJSON('https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&list=search&srnamespace=0&srlimit=1&srsearch=' + encodeURIComponent(`"${name}" actor`));
      const hit = search.query?.search?.[0]?.title;
      if(hit) d = await getJSON('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(hit.replace(/ /g,'_')));
    }
    person = {
      ...person,name:d.title||name,image:d.originalimage?.source||d.thumbnail?.source||'',
      sourceUrl:d.content_urls?.desktop?.page||'',summary:d.extract||'',description:d.description||''
    };
  }catch(e){ /* a text-only cast card remains useful */ }
  PERSON_CACHE.set(key,person);
  return person;
}
async function hydrateCast(record){
  const people = (record.cast||[]).map(normalizePerson).slice(0,16);

    const extra = await lookupPerson(person.name);
    return {...extra,...person,image:person.image||extra.image,sourceUrl:person.sourceUrl||extra.sourceUrl,summary:person.summary||extra.summary,description:person.description||extra.description};
  }));
  record.cast = hydrated;
  return hydrated;
}

async function lookupMovie(title, limit, year){
  // The year matters: a bare "Heat" lands on the 2013 comedy, "Heat 1995" on Michael Mann's.
  const q = title + (year ? ' ' + year : '') + ' film';
  const s = await getJSON('https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*'
    + '&list=search&srnamespace=0&srlimit=' + Math.min(limit,20)
    + '&srsearch=' + encodeURIComponent(q));
  const hits = (s.query?.search||[]).slice(0, limit);
  const records = await Promise.all(hits.map(async (h,index)=>{
    try{
      const d = await getJSON('https://en.wikipedia.org/api/rest_v1/page/summary/'
        + encodeURIComponent(h.title.replace(/ /g,'_')));
      if(!d.thumbnail?.source && !d.originalimage?.source) return null;
      const intro = d.extract || '';
      const description = d.description || '';
      const classifier = (description + ' ' + intro.slice(0,180)).toLowerCase();
      const nonFilm = `${d.title} ${description}`.toLowerCase();
      if(!/\bfilm\b/.test(classifier) || /film series|media franchise|novel|soundtrack|album|song|episode|list of|music of|cast members|film score/.test(nonFilm)) return null;
      const ym = description.match(/\b(19|20)\d{2}\b/)
        || (!/\bupcoming\b/i.test(description) ? intro.slice(0,180).match(/\b(19|20)\d{2}\b/) : null);
      return {
        title: d.title.replace(/\s*\([^)]*\)\s*$/,''), type:'movie',
        cover: (d.originalimage?.source || d.thumbnail.source).replace(/\?.*$/,''),
        banner: (d.originalimage?.source || d.thumbnail.source).replace(/\?.*$/,''),
        genres: genresFromIntro(intro),
        year: ym ? +ym[0] : null,
        runtime: null,
        pages: null,
        synopsis: intro.split('. ').slice(0,3).join('. ').slice(0,620),
        creator: directorFromIntro(intro) || description.replace(/^.*\bby\s+/,'').trim().slice(0,60) || '',
        cast: castFromIntro(intro),
        country: countryFromIntro(intro),
        format: description,
        popularity: Math.max(1,100-index*12+Math.min(12,Math.log10((h.wordcount||1)+1)*3)),
        sourceName:'Wikipedia',
        sourceUrl:d.content_urls?.desktop?.page || '',
        wd: d.wikibase_item || null,      // resolved to runtime + language on demand
        catalogId:d.wikibase_item?`wikidata:${d.wikibase_item}`:(d.content_urls?.desktop?.page||'')
      };
    }catch(e){ return null; }
  }));
  return records.filter(Boolean).map(record=>{
    const verified=verifiedMovieArtwork(record.title,record.year);
    if(verified){
      record.banner=record.banner||verified.banner;
      record.cover=verified.poster;
    }
    return record;
  });
}

    title:s.name,type,cover:s.image?.original || s.image?.medium || '',genres,

  };

  const request = ++catalog.request;
  catalog.query = q;
  catalog.loading = true;
  catalog.error = '';
  renderCatalogGrid();
  const settled = await Promise.allSettled([
    lookupMovie(q,20,null), lookupAnime(q,20), lookupManga(q,20), lookupSeries(q,20), lookupSeriesByPerson(q,16), lookupBook(q,30)
  ]);
  if(request!==catalog.request) return;
  const failures = settled.filter(x=>x.status==='rejected');
  const found = settled.flatMap(x=>x.status==='fulfilled' ? x.value : [])
    .filter(it=>catalogRelevance(it,q));
  const seen = new Set();
  catalog.results = found.filter(it=>{
    if(!it.title || !TYPES[it.type]) return false;
    it.key = norm(it.title);
    const key = `${it.type}|${it.key}|${it.type==='manga'||it.type==='manhwa'?'':(it.year||'')}`;
    if(seen.has(key)) return false;
    seen.add(key); return true;
  });
  catalog.loading = false;
  catalog.error = failures.length===settled.length
    ? 'Check your connection, then try the same search again.' : '';
  renderCatalogGrid();
}
