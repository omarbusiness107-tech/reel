/* Wikidata gives language as a QID; the label set is tiny, so cache it. */
const QID_LABELS = new Map();
async function qidLabel(q){
  if(QID_LABELS.has(q)) return QID_LABELS.get(q);
  let label = '';
  try{
    const d = await getJSON('https://www.wikidata.org/w/api.php?action=wbgetentities'
      + '&format=json&origin=*&props=labels&languages=en&ids=' + q);
    label = d.entities?.[q]?.labels?.en?.value || '';
  }catch(e){ /* leave blank */ }
  QID_LABELS.set(q, label);
  return label;
}
async function wikidataPeople(ids){
  const unique=[...new Set((ids||[]).filter(Boolean))].slice(0,16);
  if(!unique.length) return [];
  try{
    const d=await getJSON('https://www.wikidata.org/w/api.php?action=wbgetentities&format=json&origin=*'
      + '&props=labels|claims|sitelinks&languages=en&sitefilter=enwiki&ids=' + unique.join('|'));
    return unique.map(id=>{
      const entity=d.entities?.[id]; if(!entity) return null;
      const name=entity.labels?.en?.value||'';
      const filename=entity.claims?.P18?.[0]?.mainsnak?.datavalue?.value||'';
      const wikiTitle=entity.sitelinks?.enwiki?.title||'';
      const born=entity.claims?.P569?.[0]?.mainsnak?.datavalue?.value?.time?.slice(1,11)||'';
      return name?{name,role:'Cast',image:filename?`https://commons.wikimedia.org/wiki/Special:Redirect/file/${encodeURIComponent(filename)}?width=480`:'',sourceUrl:wikiTitle?`https://en.wikipedia.org/wiki/${encodeURIComponent(wikiTitle.replace(/ /g,'_'))}`:'',birthday:born,summary:'',description:'Film cast member'}:null;
    }).filter(Boolean);
  }catch(e){ return []; }
}
/** Second-hop details that are only worth fetching for a candidate we actually keep. */
async function topUp(c){
  try{
    if(c?.wd && !c.runtime){
      const w = await getJSON('https://www.wikidata.org/w/api.php?action=wbgetclaims&format=json&origin=*'
        + '&entity=' + c.wd);
      const v = w.claims?.P2047?.[0]?.mainsnak?.datavalue?.value;
      if(v) c.runtime = Math.round(+v.amount);
      const langQ = w.claims?.P364?.[0]?.mainsnak?.datavalue?.value?.id;
      if(langQ) c.language = await qidLabel(langQ);
      const castIds=(w.claims?.P161||[]).map(claim=>claim.mainsnak?.datavalue?.value?.id).filter(Boolean);
      if(castIds.length){ const people=await wikidataPeople(castIds); if(people.length)c.cast=people; }
    }
    if(c?.tvmaze){
      // one call gives the principal cast; another the season count
      const [cast, seasons, episodes] = await Promise.all([
        getJSON('https://api.tvmaze.com/shows/' + c.tvmaze + '/cast').catch(()=>[]),
        getJSON('https://api.tvmaze.com/shows/' + c.tvmaze + '/seasons').catch(()=>[]),
        getJSON('https://api.tvmaze.com/shows/' + c.tvmaze + '/episodes').catch(()=>[])
      ]);
      c.cast = (cast||[]).slice(0,16).map(x=>({
        name:x.person?.name||'',role:x.character?.name||'',image:x.person?.image?.original||x.person?.image?.medium||'',
        sourceUrl:x.person?.url||'',birthday:x.person?.birthday||'',country:x.person?.country?.name||'',summary:'',description:'TV actor'
      })).filter(person=>person.name);
      if((seasons||[]).length) c.seasons = seasons.length;
      if((episodes||[]).length) setEpisodeGuide(c,episodes);
    }
    if(c?.kitsu && !c.genres.length){
      const d = await getJSON('https://kitsu.io/api/edge/anime/' + c.kitsu + '/categories?page[limit]=20');
      // Kitsu mixes real genres with settings and places ("Future", "Space", "Japan").
      // Keep the recognised genres; only fall back to the rest if none matched.
      const all = (d.data||[]).map(x=>x.attributes.title);
      const real = all.filter(t=>ANIME_GENRES.has(t.toLowerCase()));
      c.genres = tidyGenres(real.length ? real : all);
    }
    if(c?.kitsuManga && !c.genres.length){
      const d = await getJSON('https://kitsu.io/api/edge/manga/' + c.kitsuManga + '/categories?page[limit]=20');
      c.genres = tidyGenres((d.data||[]).map(x=>x.attributes.title));
    }
  }catch(e){ /* optional detail — never block on it */ }
  return c;
}

/** Copy a candidate onto an item without clobbering anything the user set. */
function applyMeta(it, c, {force=false}={}){
  if(!c) return;
  if(c.banner && (force || !it.banner)) it.banner = c.banner;
  if(c.cover && (force || !it.cover)) it.cover = c.cover;
  if(c.genres?.length && (force || !it.genres.length)) it.genres = c.genres;
  if(c.year && (force || !it.year)) it.year = c.year;
  if(c.runtime && (force || !it.runtime)) it.runtime = c.runtime;
  if(c.pages && (force || !it.pages)) it.pages = c.pages;
  if(c.chapters && (force || !it.chapters)) it.chapters = c.chapters;
  if(c.synopsis && (force || !it.synopsis)) it.synopsis = c.synopsis;
  if(c.creator && (force || !it.creator)) it.creator = c.creator;
  if(c.cast?.length && (force || !it.cast.length)) it.cast = c.cast;
  if(c.score != null && (force || it.score == null)){it.score=c.score;it.ratingSource=c.ratingSource||c.sourceName||'';}
  if(c.country && (force || !it.country)) it.country = c.country;
  if(c.language && (force || !it.language)) it.language = c.language;
  if(c.showStatus && (force || !it.showStatus)) it.showStatus = c.showStatus;
  if(c.seasons && (force || !it.seasons)) it.seasons = c.seasons;
  if(c.ageRating && (force || !it.ageRating)) it.ageRating = c.ageRating;
  for(const field of ['tvmaze','kitsu','progressSource','progressCheckedAt']) if(c[field]!=null)it[field]=c[field];
  if(Array.isArray(c.seasonGuide)){it.seasonGuide=c.seasonGuide;it.seasons=c.seasons;it.pages=c.pages;it.episodeCount=c.episodeCount;clampProgress(it);}
  for(const field of ['format','premiered','ended','schedule','officialSite','ageRatingGuide','episodeCount','volumes','publisher','isbn','editions','ratingsCount','wantToReadCount','alreadyReadCount','userCount','favouritesCount','popularityRank','ratingRank','sourceName','sourceUrl','firstSentence','catalogId','series','seriesName','seriesNumber','searchTerms']){
    if(c[field] != null && c[field] !== '' && (force || it[field] == null || it[field] === '')) it[field] = c[field];
  }
}
function runtimeLabel(it){
  if(it.type==='book') return it.pages ? it.pages+' pages' : '';
  if(it.type==='manga'||it.type==='manhwa') return it.chapters ? it.chapters+' chapters' : '';
  if(!it.runtime) return '';
  if(it.type==='series'||it.type==='anime') return it.runtime+'m/ep';
  const h = Math.floor(it.runtime/60), m = it.runtime%60;
  return h ? `${h}h ${m}m` : `${m}m`;
}

let fetching = false;
async function fetchMissingCovers(){
  if(fetching) return;
  // metaTried marks "we already asked about this one" — otherwise titles that legitimately
  // have no genre listed would be looked up again on every press.
  const todo = state.items.filter(i=>!i.metaTried && (!i.cover || !i.genres.length));
  if(!todo.length){ toast('Everything has been looked up already.', 'Look again', ()=>{
    state.items.forEach(i=>{ if(!i.cover || !i.genres.length) i.metaTried = false; });
    fetchMissingCovers();
  }); return; }
  fetching = true;
  const bar = $('#fetchbar i');
  let hit = 0, done = 0, next = 0;
  toast(`Fetching art and genres for ${todo.length} titles. You can keep using the app.`);

  // Four workers pull from one queue: fast enough to matter, gentle enough on the APIs.
  const worker = async ()=>{
    while(next < todo.length){
      const it = todo[next++];
      try{
        const [best] = await lookup(it, 1);
        if(best){ await topUp(best); applyMeta(it, best); hit++; }
        else it.noCover = true;
        it.metaTried = true;
      }catch(e){ it.noCover = true; }
      done++;
      bar.style.transform = `scaleX(${done/todo.length})`;
      if(done % 8 === 0){ save(); renderGrid(); renderRail(); }
      await new Promise(r=>setTimeout(r, 90));
    }
  };
  await Promise.all([worker(),worker(),worker(),worker()]);
  bar.style.transform = 'scaleX(0)';
  fetching = false;
  refreshLibrarySurfaces({genres:true,counts:true});
  const missed = todo.length - hit;
  toast(`Matched ${hit} of ${todo.length}.`, missed?'Retry the misses':null, missed?()=>{
    state.items.forEach(i=>{ if(!i.cover){ i.noCover=false; i.metaTried=false; } });
    fetchMissingCovers();
  }:null);
}

/** Downscale an uploaded image so localStorage survives it. */
function shrink(file, maxW=360, maxH=540){
  return new Promise(res=>{
    const img = new Image();
    img.onload = ()=>{
      const r = Math.min(maxW/img.width, maxH/img.height, 1);
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*r); c.height = Math.round(img.height*r);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',0.72));
      URL.revokeObjectURL(img.src);
    };
    img.onerror = ()=>res('');
    img.src = URL.createObjectURL(file);
  });
}

          <option value="30">Under 30 min</option>
          <option value="60">Under 1 hour</option>
          <option value="100">Under 1h 40m</option>
          <option value="130">Under 2h 10m</option>
        </select></div>
      </div>
      <div id="pResult"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
        <button class="btn ghost" data-close>Close</button>
        <button class="btn primary" id="pRoll">Pick another</button>
      </div>
    </div>`, root=>{
      const gsel = $('#pGenre',root);
      const fillGenres = ()=>{
        const t = $('#pType',root).value;
        const scope = t==='all' ? pool0 : pool0.filter(i=>i.type===t);
        gsel.innerHTML = `<option value="">Any genre</option>` +
          genreIndex(scope).map(([g,n])=>`<option value="${esc(g)}" ${pickPrefs.genre===g?'selected':''}>${esc(g)} · ${n}</option>`).join('');
      };
      const pool = ()=>{
        let p = pool0;
        const t = $('#pType',root).value, g = gsel.value, mx = +$('#pMax',root).value;
        if(t!=='all') p = p.filter(i=>i.type===t);
        if(g) p = p.filter(i=>i.genres.includes(g));
        if(mx) p = p.filter(i=>i.runtime && i.runtime<=mx);
        return p;
      };
      const roll = ()=>{
        pickPrefs.type = $('#pType',root).value;
        pickPrefs.genre = gsel.value;
        pickPrefs.max = +$('#pMax',root).value;
        const p = pool();
        const box = $('#pResult',root);
        if(!p.length){
          box.innerHTML = `<div class="empty" style="padding:34px 10px">
            <b>Nothing fits</b>Loosen a filter or run <b>Enrich</b> so runtimes and genres are filled in.</div>`;
          return;
        }
        const it = p[Math.floor(Math.random()*p.length)];
        const {style,art,posterClass} = posterInner(it);
        box.innerHTML = `
          <div style="display:flex;gap:14px;margin-top:6px;padding:14px;background:var(--panel);
                      border:1px solid var(--line);border-radius:14px">
            <div class="${posterClass}" style="${style};width:92px;flex:0 0 auto;border-radius:10px">${art}</div>
            <div style="min-width:0;flex:1">
              <h2 style="margin:0 0 5px;font-size:18px;line-height:1.25">${esc(it.title)}</h2>
              <div class="hint" style="margin-bottom:8px">
                ${esc(typeName(it.type))}${it.year?' / '+it.year:''}
                ${runtimeLabel(it)?' · '+esc(runtimeLabel(it)):''}
                ${it.creator?' · '+esc(it.creator):''}
              </div>
              ${it.genres.length?`<div class="chips" style="margin-bottom:9px">${
                it.genres.map(g=>`<span class="chip" style="pointer-events:none">${esc(g)}</span>`).join('')}</div>`:''}
              ${it.synopsis?`<p class="hint" style="margin:0 0 10px;color:var(--fg2)">${esc(it.synopsis)}</p>`:''}
              <div style="display:flex;gap:7px;flex-wrap:wrap">
                <button class="btn sm primary" data-go="${it.id}">Start it</button>
                <button class="btn sm ghost" data-open="${it.id}">Details</button>
              </div>
            </div>
          </div>
          <p class="hint" style="margin-top:9px">${p.length} title${p.length>1?'s':''} match right now.</p>`;
        box.onclick = e=>{
          const go = e.target.closest('[data-go]'), op = e.target.closest('[data-open]');
          if(go){ it.status='going'; it.updated=now(); closeSheets(); refreshLibrarySurfaces({counts:false});
                  toast(`“${it.title}” is on your Continue shelf.`); }
          if(op){ closeSheets(); openItem(it.id); }
        };
      };
      fillGenres();
      $('#pType',root).onchange = ()=>{ fillGenres(); roll(); };
      gsel.onchange = roll;
      $('#pMax',root).value = String(pickPrefs.max);
      $('#pMax',root).onchange = roll;
      $('#pRoll',root).onclick = roll;
      roll();
    });
}

function modalSettings(){
  const u = storageUse();
  const c = {}; for(const k in STATUS) c[k] = state.items.filter(i=>i.status===k).length;
  const visibleTabs=normalizeTabPrefs(state.ui.tabs);
  const hiddenTabs=BUILTIN_TAB_KEYS.filter(key=>!visibleTabs.includes(key));
  const tabCount=key=>state.items.filter(item=>item.type===key).length;
  const tabRow=(key,pinned=false)=>{
    const label=key==='all'?tr('tab.library'):(key==='catalog'?tr('tab.catalog'):typeName(key,true));
    const count=key==='all'?state.items.length:(key==='catalog'?tr('tab.online'):tabCount(key));
    return `<div class="tab-manager-row">
      <span class="tab-manager-copy">${icon(TYPE_ICONS[key],15)}<b>${esc(label)}</b><small>${esc(count)}</small></span>
      ${pinned?`<span class="tab-manager-pin">${icon('pin',12)} ${esc(tr('settings.pinned'))}</span>`:
        `<button type="button" class="btn sm ghost tab-manager-remove" data-remove-tab="${key}" aria-label="${esc(tr('settings.removeTab',{tab:label}))}" title="${esc(tr('settings.removeTab',{tab:label}))}">${icon('x',14)}</button>`}
    </div>`;
  };
  showModal(`
    <div class="sheet-head"><h3>${esc(tr('settings.title'))}</h3><button class="btn sm ghost" data-close>${icon('x',14)}${esc(tr('detail.close'))}</button></div>
    <div class="sheet-body">
      <div class="stat-strip">
        <div class="stat"><b>${state.items.length}</b><span>Titles</span></div>
        <div class="stat"><b>${c.going}</b><span>In progress</span></div>
        <div class="stat"><b>${c.done}</b><span>Finished</span></div>
        <div class="stat"><b>${c.want}</b><span>Waiting</span></div>
      </div>
      <div class="field" style="margin-top:22px">
        <label>${esc(tr('settings.language'))}</label>
        <select id="sLanguage" aria-label="${esc(tr('settings.language'))}">
          ${['en','fr','ar'].map(language=>`<option value="${language}" ${state.ui.language===language?'selected':''}>${esc(tr('language.'+language))}</option>`).join('')}
        </select>
        <p class="hint" style="margin-top:8px">${esc(tr('settings.languageHelp'))}</p>
      </div>
      <div class="field settings-tabs">
        <label>${esc(tr('settings.tabs'))}</label>
        <p class="hint">${esc(tr('settings.tabsHelp'))}</p>
        <div class="tab-manager">
          ${tabRow('all',true)}
          ${visibleTabs.map(key=>tabRow(key)).join('')}
          ${tabRow('catalog',true)}
        </div>
        <div class="tab-manager-add">
          <select id="sTabAdd" aria-label="${esc(tr('settings.addTab'))}" ${hiddenTabs.length?'':'disabled'}>
            ${hiddenTabs.length?hiddenTabs.map(key=>`<option value="${key}">${esc(typeName(key,true))}</option>`).join(''):`<option>${esc(tr('settings.allTabs'))}</option>`}
          </select>
          <button class="btn" type="button" id="sTabAddBtn" ${hiddenTabs.length?'':'disabled'}>${icon('plus',14)} ${esc(tr('settings.addTab'))}</button>
        </div>
      </div>
      <div class="field" style="margin-top:22px">
        <label>Browser storage · ${(u.bytes/1024).toFixed(0)} KB of ~5 MB</label>
        <div class="meter"><i style="width:${u.pct.toFixed(1)}%"></i></div>
        <p class="hint" style="margin-top:8px">Fetched covers are stored as links (tiny). Uploaded images are
        stored inside this browser, so they count against the limit.</p>
      </div>
      <div class="field">
        <label>${esc(tr('settings.backup'))}</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn" id="sExport">Export JSON</button>
          <button class="btn" id="sImportBtn">Import JSON</button>
          <input type="file" accept="application/json" id="sImport" hidden>
        </div>
        <p class="hint" style="margin-top:8px">Keep a copy somewhere safe. Clearing browser data wipes the library.</p>
      </div>
      <div class="field">
        <label>${esc(tr('settings.cloud'))}</label>
        <p class="hint" id="cloudStatus">${cloudStatus()}</p>
        ${cloud.user ? `
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn" id="sCloudSync">Sync now</button>
            <button class="btn ghost" id="sCloudSignOut">Sign out</button>
          </div>` : `
          <div class="two">
            <div class="field"><label>Email</label><input id="sCloudEmail" type="email" autocomplete="email" placeholder="you@example.com"></div>
            <div class="field"><label>Password</label><input id="sCloudPassword" type="password" autocomplete="current-password" placeholder="At least 6 characters"></div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn primary" id="sCloudSignIn">Sign in</button>
            <button class="btn ghost" id="sCloudSignUp">Create account</button>
          </div>
          <p class="hint" style="margin-top:8px">Sign in to keep one private library across your devices.</p>`}
      </div>
      <div class="field">
        <label>${esc(tr('settings.danger'))}</label>
        <button class="btn danger" id="sReset">Erase everything and re-seed</button>
      </div>
      <p class="hint" style="margin-top:18px">
        Shortcuts: <b>/</b> search · <b>n</b> new title · <b>Esc</b> close.
      </p>
    </div>`, root=>{
      $('#sLanguage',root).onchange = e=>{
        state.ui.language=e.target.value; save(); render(); modalSettings();
      };
      $$('[data-remove-tab]',root).forEach(button=>button.onclick=()=>{
        const key=button.dataset.removeTab;
        state.ui.tabs=normalizeTabPrefs(state.ui.tabs).filter(tab=>tab!==key);
        if(filterType===key) filterType='all';
        save(); render(); modalSettings();
        toast(tr('settings.tabRemoved',{tab:typeName(key,true)}));
      });
      $('#sTabAddBtn',root).onclick=()=>{
        const key=$('#sTabAdd',root).value;
        if(!BUILTIN_TAB_KEYS.includes(key)) return;
        state.ui.tabs=normalizeTabPrefs([...normalizeTabPrefs(state.ui.tabs),key]);
        save(); render(); modalSettings();
        toast(tr('settings.tabAdded',{tab:typeName(key,true)}));
      };
      $('#sExport',root).onclick = exportJSON;
      $('#sImportBtn',root).onclick = ()=>$('#sImport',root).click();
      $('#sImport',root).onchange = e=>importJSON(e.target.files[0]);
      if(cloud.user){
        $('#sCloudSync',root).onclick = async ()=>{ await pushCloud(); toast('Cloud sync complete.'); };
        $('#sCloudSignOut',root).onclick = cloudSignOut;
      }else if(cloud.client){
        const credentials = ()=>({email:$('#sCloudEmail',root).value.trim(), password:$('#sCloudPassword',root).value});
        $('#sCloudSignIn',root).onclick = ()=>{ const {email,password}=credentials(); if(email&&password) cloudSignIn(email,password); };
        $('#sCloudSignUp',root).onclick = ()=>{ const {email,password}=credentials(); if(email&&password) cloudSignUp(email,password); };
      }
      $('#sReset',root).onclick = ()=>{
        if(!confirm('Erase your whole library and start again from the original lists?')) return;
        state = blank(); seedIfEmpty(); closeSheets(); render();
      };
    });
}

function exportJSON(){
  const blob = new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `reel-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('Backup downloaded.');
}
function importJSON(file){
  if(!file) return;
  const fr = new FileReader();
  fr.onload = ()=>{
    try{
      const data = JSON.parse(fr.result);
      if(!Array.isArray(data.items)) throw new Error('not a reel backup');
      data.items = data.items.map(migrate);
      const merge = confirm('OK = merge into your current library.\nCancel = replace it entirely.');
      if(merge){
        const seen = new Set(state.items.map(i=>`${i.type}|${i.key}|${i.year||''}`));
        let n=0;
        for(const it of data.items){ const identity=`${it.type}|${it.key}|${it.year||''}`; if(!seen.has(identity)){ state.items.push(it); seen.add(identity); n++; } }
        toast(`Merged ${n} new titles.`);
      }else{
        state = normalizeState(data); toast('Library replaced.');
      }
      closeSheets(); render();
    }catch(e){ toast('That file is not a reel backup.'); }
  };
  fr.readAsText(file);
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg, actionLabel, onAction){
  $('#toastMsg').textContent = msg;
  const b = $('#toastAct');
  if(actionLabel){ b.hidden=false; b.textContent=actionLabel; b.onclick=()=>{ onAction&&onAction(); hideToast(); }; }
  else b.hidden = true;
  $('#toast').classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, actionLabel?7000:3200);
}
const hideToast = ()=>$('#toast').classList.remove('on');

function closeMobileMenu(restoreFocus=false){
  const menu = $('#mobileMenu');
  if(menu.hidden) return;
  menu.hidden = true;
  $('#btnMobileMenu').setAttribute('aria-expanded','false');
  if(restoreFocus) $('#btnMobileMenu').focus();
}

function toggleMobileMenu(){
  const menu = $('#mobileMenu');
  const opening = menu.hidden;
  menu.hidden = !opening;
  $('#btnMobileMenu').setAttribute('aria-expanded',String(opening));
  if(opening) setTimeout(()=>menu.querySelector('[role="menuitem"]')?.focus(),0);
}

function toggleTheme(){
  state.ui.theme = state.ui.theme==='dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme=state.ui.theme;
  setButtonLabel('#btnTheme',state.ui.theme==='dark'?localeMeta().light:localeMeta().dark);
  setButtonLabel('#mobileTheme',state.ui.theme==='dark'?localeMeta().switchLight:localeMeta().switchDark);
  save();
}
function activateType(type,direction=1){
  const tabs=$('#typeTabs');
  const before=tabs.getBoundingClientRect();
  const keepTabPosition=before.bottom>0 && before.top<window.innerHeight;
  const scrollBefore=window.scrollY;
  filterType=type;libraryPage=1;
  renderGenres();
  updateModeChrome();
  renderGrid();
  if(keepTabPosition){
    const shift=tabs.getBoundingClientRect().top-before.top;
    if(Math.abs(shift)>.5) window.scrollTo(0,Math.max(0,scrollBefore+shift));
  }
  requestAnimationFrame(()=>tabs.querySelector(`[data-type="${type}"]`)?.scrollIntoView({
    behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest',inline:'nearest'
  }));
  playContentSwap(direction);
  if(filterType==='catalog') queueCatalogSearch();
}

document.addEventListener('click', async e=>{
  if(openSmart && !e.target.closest('.smart-select') && !e.target.closest('.smart-select-menu')) closeSmartSelect();
  if(!e.target.closest('#mobileMenu')) closeMobileMenu();
  if(e.target.closest('[data-close]')) { closeSheets(); return; }

  const zoom = e.target.closest('[data-zoom-src]');
  if(zoom){ openMedia(zoom.dataset.zoomSrc,zoom.dataset.zoomTitle); return; }
  const person = e.target.closest('[data-person-index]');
  if(person){ const selected=activePeople[+person.dataset.personIndex]; if(selected) openPerson(selected); return; }
  if(e.target.closest('[data-search-online]')){
    activateType('catalog',1); return;
  }
  if(e.target.closest('[data-clear-library-filters]')){ filterStatus.clear();filterGenre='';libraryPage=1;syncStatusSelection();renderGenres();updateModeChrome();renderGrid();return; }

  if(e.target.closest('[data-catalog-retry]')){ searchCatalog(query); return; }
  if(e.target.closest('[data-catalog-reset]')){
    catalog.type='all'; catalog.year='all'; catalog.sort='popularity'; renderCatalogControls(); renderCatalogGrid(); refreshIcons(); return;
  }

  const libraryLink=e.target.closest('[data-library-id]');
  if(libraryLink){ goToLibraryItem(libraryLink.dataset.libraryId); return; }
  const catalogRemove=e.target.closest('[data-catalog-remove]');
  if(catalogRemove){ removeCatalogLibrary(catalogRemove.dataset.catalogRemove); return; }

  const catalogAdd = e.target.closest('[data-catalog-add]');
  if(catalogAdd){ addCatalogItem(+catalogAdd.dataset.catalogAdd); return; }

  const catalogCard = e.target.closest('.catalog-card');
  if(catalogCard){ openCatalogItem(+catalogCard.dataset.catalogIndex); return; }

  const resume = e.target.closest('.resume');
  if(resume){
    const it = state.items.find(i=>i.id===resume.dataset.id); if(!it) return;
    const act = e.target.closest('[data-act]')?.dataset.act;
    if(act==='bump'){ await bump(it, it.type==='book'?10:1); refreshLibrarySurfaces({counts:false}); }
    else if(act==='done'){ await changeItemStatus(it,'done'); refreshLibrarySurfaces({counts:false}); }
    else openItem(it.id);
    return;
  }

  const card = e.target.closest('.card');
  if(card){
    const it = state.items.find(i=>i.id===card.dataset.id); if(!it) return;
    const act = e.target.closest('[data-act]')?.dataset.act;
    if(act==='start'){
      if(it.type==='movie'){ it.status='going'; it.updated=now(); }
      else if(!await bump(it,1)) return;
      it.status = 'going'; it.updated = now(); refreshLibrarySurfaces({counts:false});
    } else if(act==='bump'){
      if(it.type==='movie') await changeItemStatus(it,'done');
      else await bump(it, it.type==='book'?10:1);
      refreshLibrarySurfaces({counts:false});
    } else openItem(it.id);
  }
});

document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && !$('#personViewer').hidden){ closePerson(); return; }
  if(e.key==='Escape' && !$('#mediaViewer').hidden){ closeMedia(); return; }
  if(e.key==='Escape' && openSmart){ closeSmartSelect(true); return; }
  if(e.key==='Escape' && !$('#mobileMenu').hidden){ closeMobileMenu(true); return; }
  if(e.key==='Escape'){ closeSheets(); return; }
  if(e.key==='Tab'){
    const panel = $('#modal').classList.contains('on') ? $('#modal') : ($('#drawer').classList.contains('on') ? $('#drawer') : null);
    if(panel){
      const focusable = $$('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])',panel)
        .filter(el=>el.getClientRects().length);
      if(focusable.length){
        const first=focusable[0], last=focusable[focusable.length-1];
        if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
        else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
      }
    }
  }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if(typing) return;
  if(e.key==='/'){ e.preventDefault(); $('#q').focus(); }
  if(e.key==='n'){ e.preventDefault(); modalAdd(); }
  if((e.key==='Enter'||e.key===' ') && document.activeElement.matches('.catalog-card')){
    e.preventDefault(); openCatalogItem(+document.activeElement.dataset.catalogIndex);
  }else if((e.key==='Enter'||e.key===' ') && document.activeElement.matches('.card[data-id]')){
    e.preventDefault(); openItem(document.activeElement.dataset.id);
  }
});

/* ---------- boot ---------- */

initCloud();
new IntersectionObserver(([entry])=>{ $('#backToTop').hidden=entry.isIntersecting; },{rootMargin:'240px 0px 0px 0px'}).observe($('#pageTop'));
$('#backToTop').onclick=()=>{window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});const heading=$('main h1');heading.tabIndex=-1;heading.focus({preventScroll:true});};
if(state.items.length && !state.items.some(i=>i.cover)){
  toast('Your lists are loaded. Fetch the poster art?', 'Fetch covers', fetchMissingCovers);
}
